<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>야구왕 2인</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#000;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:#fff}
iframe{position:fixed;border:0;display:block;background:#000}
.side{position:fixed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;overflow:hidden}
.side.red{background:radial-gradient(ellipse at 50% 30%,#7f1d1d,#2a0707 70%)}
.side.blue{background:radial-gradient(ellipse at 50% 30%,#1e3a8a,#07112a 70%)}
.side h2{font-size:7vh;font-weight:900;letter-spacing:.05em}
.side .part{font-size:4vh;font-weight:900;opacity:.9}
.side .score{font-size:26vh;font-weight:900;line-height:1;color:#fde047;text-shadow:0 0 4vh rgba(253,224,71,.5);font-variant-numeric:tabular-nums}
.side .unit{font-size:4vh;font-weight:900;margin-top:-1vh}
.side .log{font-size:5vh;max-width:80%;line-height:1.3;min-height:6vh;word-break:break-all}
.side .ban{font-size:9vh;font-weight:900;color:#fde047;display:none;animation:p 1s infinite alternate}
@keyframes p{to{transform:scale(1.08)}}
.side .deco{position:absolute;bottom:4vh;font-size:12vh;opacity:.25}
#divider{position:fixed;width:.6vh;background:linear-gradient(#fde047,#fff,#fde047);box-shadow:0 0 2vh #fde047;pointer-events:none}
</style>
</head>
<body>
<div class="side red" id="sL"><h2>🔴 빨강 선수</h2><div class="part" id="pL">준비 중</div><div class="score" id="cL">0</div><div class="unit">점</div><div class="log" id="gL"></div><div class="ban" id="bL"></div><div class="deco">⚾🧢</div></div>
<div class="side blue" id="sR"><h2>파랑 선수 🔵</h2><div class="part" id="pR">준비 중</div><div class="score" id="cR">0</div><div class="unit">점</div><div class="log" id="gR"></div><div class="ban" id="bR"></div><div class="deco">🧢⚾</div></div>
<iframe id="fL" src="/baseball-vr.html?embed=1&team=red" allow="autoplay"></iframe>
<iframe id="fR" src="/baseball-vr.html?embed=1&team=blue" allow="autoplay"></iframe>
<div id="divider"></div>
<script>window.TUIO_DWELL_MS=4000;</script>
<script src="/tuio-pointer.js"></script>
<script>
// 정면 벽을 반으로 나눠 왼쪽 = 빨강, 오른쪽 = 파랑. 왼쪽 벽 = 빨강 점수판, 오른쪽 벽 = 파랑 점수판
const $=s=>document.querySelector(s);
const LS='baseballduo.',WALLS=['left','front','right'];
function load(k,d){try{const v=localStorage.getItem(LS+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
(function(){const m=/walls=([-\d,;]+)/.exec(decodeURIComponent(location.hash||''));if(!m)return;
  const p=m[1].split(';').map(t=>t.split(',').map(Number));if(p.length!==3||p.some(a=>a.length!==4||a.some(isNaN)))return;
  const w={};WALLS.forEach((k,i)=>w[k]={x:p[i][0],y:p[i][1],w:p[i][2],h:p[i][3]});save('walls',w)})();
function viewportOrigin(){const bx=Math.max(0,(outerWidth-innerWidth)/2);return {x:screenX+bx,y:screenY+Math.max(0,outerHeight-innerHeight-bx)}}
function rects(){const W=innerWidth,H=innerHeight,walls=load('walls',null),R={};
  if(walls&&walls.left&&walls.front&&walls.right){const o=viewportOrigin();let ok=true;
    for(const k of WALLS){const s=walls[k];let x0=Math.max(0,s.x-o.x),y0=Math.max(0,s.y-o.y),x1=Math.min(W,s.x-o.x+s.w),y1=Math.min(H,s.y-o.y+s.h);if(x1-x0<50||y1-y0<50)ok=false;R[k]={x:x0,y:y0,w:x1-x0,h:y1-y0}}
    if(ok)return R}
  const w=W/3;WALLS.forEach((k,i)=>R[k]={x:Math.round(i*w),y:0,w:Math.round(w),h:H});return R}
if(/norender/.test(location.search))for(const id of ['#fL','#fR'])$(id).src+='&norender';   // 시험용
const place=(el,r)=>Object.assign(el.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});
function layout(){const R=rects(),f=R.front,hw=Math.floor(f.w/2);
  place($('#fL'),{x:f.x,y:f.y,w:hw,h:f.h});place($('#fR'),{x:f.x+hw,y:f.y,w:f.w-hw,h:f.h});
  place($('#divider'),{x:f.x+hw-3,y:f.y,w:6,h:f.h});place($('#sL'),R.left);place($('#sR'),R.right)}
addEventListener('resize',layout);let lp='';setInterval(()=>{const p=screenX+','+screenY;if(p!==lp){lp=p;layout()}},1000);layout();

// 센서 터치 → 해당 반쪽 게임으로 넘겨주기
for(const t of ['pointerdown','pointermove','pointerup','pointercancel'])
  document.addEventListener(t,e=>{const f=e.target;if(!f||f.tagName!=='IFRAME')return;const r=f.getBoundingClientRect();
    f.contentWindow.postMessage({vrptr:1,type:e.type,id:e.pointerId,x:e.clientX-r.left,y:e.clientY-r.top},'*')},true);

// 점수판
const ST={red:null,blue:null};
addEventListener('message',e=>{const d=e.data;if(!d||d.bb!==1)return;ST[d.team]=d;const s=d.team==='red'?'L':'R';
  $('#c'+s).textContent=d.score;$('#g'+s).textContent=d.log;$('#p'+s).textContent=d.part==='pitch'?'🤾 투수':'🏏 타자';
  if(!d.done){$('#b'+s).style.display='none'}
  const a=ST.red,b=ST.blue;
  if(a&&b&&a.done&&b.done&&a.part!==b.part){for(const x of ['L','R']){const el=$('#b'+x);el.style.display='block';el.textContent='🎉 둘 다 잘했어요!'}}
  else if(a&&b&&a.done&&b.done){const w=a.score===b.score?null:a.score>b.score?'L':'R';
    for(const x of ['L','R']){const el=$('#b'+x);el.style.display='block';el.textContent=!w?'🤝 비겼어요!':w===x?'🏆 승리!':'👏 잘했어요!'}
    try{const u=new SpeechSynthesisUtterance(!w?'비겼어요! 둘 다 최고!':(w==='L'?'빨강':'파랑')+' 선수 승리!');u.lang='ko-KR';speechSynthesis.speak(u)}catch(e){}}
  else if(d.done){$('#b'+s).style.display='block';$('#b'+s).textContent='끝! 친구를 기다려요'}});
addEventListener('keydown',e=>{if(e.key==='F5'){}});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
