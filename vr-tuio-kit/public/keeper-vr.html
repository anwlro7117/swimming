<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>슈퍼 골키퍼</title>
<style>
:root{--u:10px;--red:#ef4444;--blue:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#000;font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#1b2333}
button{font-family:inherit;border:none;cursor:pointer;color:inherit}
canvas#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.wallui{position:fixed;pointer-events:none;overflow:hidden}
.screen,.ov{position:absolute;inset:0;display:none;pointer-events:auto}
.screen.on,.ov.on{display:flex}
#home{flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;background:radial-gradient(ellipse at 50% 20%,rgba(20,60,40,.55),rgba(5,15,30,.85))}
#home h1{font-size:10vh;font-weight:900;color:#fff;text-shadow:0 .8vh 0 #0e7a3b,0 1.6vh 3vh rgba(0,0,0,.5);text-align:center;line-height:1.1}
#home h1 small{display:block;font-size:3vh;color:#d9ffe6;text-shadow:0 .3vh .6vh rgba(0,0,0,.6);font-weight:700;margin-top:1vh}
.row{display:flex;gap:calc(var(--u)*1.2);align-items:center;flex-wrap:wrap;justify-content:center}
.lbl{font-size:2.8vh;font-weight:900;color:#fff;min-width:calc(var(--u)*8);text-align:right;text-shadow:0 .2vh .4vh #000}
.opt{font-size:3vh;font-weight:900;padding:1.3vh calc(var(--u)*2);border-radius:5vh;background:rgba(255,255,255,.9);box-shadow:0 .6vh 0 rgba(0,0,0,.35)}
.opt.sel{background:#ffd23f;transform:translateY(-.3vh)}
.opt small{display:block;font-size:1.8vh;font-weight:700;opacity:.7}
#startBtn{font-size:5.6vh;font-weight:900;padding:2vh calc(var(--u)*7);border-radius:7vh;background:#22c55e;color:#fff;box-shadow:0 1vh 0 #15803d}
#hud{position:absolute;left:50%;top:1.6vh;transform:translateX(-50%);display:none;gap:calc(var(--u)*1);align-items:center;pointer-events:none}
#hud.on{display:flex}
#hud span{background:rgba(0,0,0,.55);color:#fff;font-weight:900;font-size:3.6vh;padding:.8vh calc(var(--u)*2);border-radius:4vh}
#hud .turn{color:#fff}
#homeBtn{position:absolute;right:1.4vh;top:1.4vh;width:7.5vh;height:7.5vh;border-radius:50%;background:rgba(255,255,255,.9);font-size:3.6vh;display:none;pointer-events:auto}
#homeBtn.on{display:block}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:14vh;font-weight:900;color:#fff;pointer-events:none;opacity:0;text-shadow:0 1vh 0 rgba(0,0,0,.35),0 0 4vh rgba(0,0,0,.5)}
#msg small{display:block;font-size:4.4vh;margin-top:1vh}
#msg.show{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.glove{position:absolute;font-size:16vh;pointer-events:none;transform:translate(-50%,-50%);animation:gl .9s ease-out forwards}
@keyframes gl{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-30deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1) rotate(0)}}
.ov{align-items:center;justify-content:center;background:rgba(5,10,20,.6);z-index:5}
#count{font-size:32vh;font-weight:900;color:#fff;text-shadow:0 1.2vh 0 #0e7a3b}
.card{background:#fff;border-radius:4vh;padding:4vh calc(var(--u)*4);text-align:center;min-width:60%;box-shadow:0 2vh 6vh rgba(0,0,0,.5)}
.card h2{font-size:7.4vh;font-weight:900;line-height:1.2}
.card p{font-size:3vh;margin:1.4vh 0 2.4vh;color:#555}
.res{display:flex;gap:calc(var(--u)*2);justify-content:center;margin:1.4vh 0 2.4vh}
.res div{border-radius:3vh;padding:1.8vh calc(var(--u)*2.6);color:#fff;min-width:30%}
.res b{display:block;font-size:8vh;line-height:1}
.res small{display:block;font-size:2.3vh;margin-top:1vh;line-height:1.5}
.btns{display:flex;gap:calc(var(--u)*2);justify-content:center}
.btns button{font-size:3.6vh;font-weight:900;padding:1.8vh calc(var(--u)*3.4);border-radius:4vh;background:#ffd23f;box-shadow:0 .6vh 0 rgba(0,0,0,.15)}
.btns button.g{background:#e9ecef}
/* 옆 벽 전광판 */
.board{position:absolute;left:50%;top:6%;transform:translateX(-50%);background:linear-gradient(#111827,#0b1220);border:.8vh solid #374151;border-radius:2vh;padding:2vh calc(var(--u)*3);text-align:center;color:#fff;box-shadow:0 0 4vh rgba(0,0,0,.6);min-width:46%;display:none}
.board.on{display:block}
.board h3{font-size:3.4vh;color:#9ca3af;letter-spacing:.2em}
.board .big{font-size:13vh;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;color:#fde047;text-shadow:0 0 2vh rgba(253,224,71,.6)}
.board .sub{font-size:3.4vh;font-weight:900;margin-top:.6vh}
.board .dots{margin-top:1.4vh;font-size:4vh;letter-spacing:.3vh}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="wallui" id="uiL"><div class="board" id="sbL"><h3>SCOREBOARD</h3><div class="big" id="sbBig">0 : 0</div><div class="sub" id="sbSub">선방 : 골</div><div class="dots" id="sbDots"></div></div></div>
<div class="wallui" id="uiR"><div class="board" id="sbR"><h3>NEXT</h3><div class="big" id="nxBig">1</div><div class="sub" id="nxSub">번째 공</div></div></div>
<div class="wallui" id="ui">
  <section id="home" class="screen on">
    <h1>🧤 슈퍼 골키퍼 ⚽<small>날아오는 공을 손으로 막아요!</small></h1>
    <div class="row"><span class="lbl">놀이</span>
      <button class="opt" data-k="mode" data-v="solo">🙋 혼자 / 다 같이<small>공 10개</small></button>
      <button class="opt" data-k="mode" data-v="duo">🔴 번갈아 대결 🔵<small>한 팀에 5개씩</small></button>
      <button class="opt" data-k="mode" data-v="many">🏟️ 많이 막기<small>공 20개</small></button>
    </div>
    <div class="row"><span class="lbl">난이도</span>
      <button class="opt" data-k="lv" data-v="0">🐣 쉬움<small>느린 공</small></button>
      <button class="opt" data-k="lv" data-v="1">🐥 보통<small>휘는 공</small></button>
      <button class="opt" data-k="lv" data-v="2">🦅 어려움<small>빠른 공</small></button>
    </div>
    <div class="row"><span class="lbl">공 높이</span>
      <button class="opt" data-k="ht" data-v="0">낮게</button>
      <button class="opt" data-k="ht" data-v="1">보통</button>
      <button class="opt" data-k="ht" data-v="2">높게</button>
    </div>
    <button id="startBtn">시작! ▶</button>
  </section>
  <div id="hud"><span id="hudN">1 / 10</span><span id="hudS">🧤 0</span><span class="turn" id="hudT"></span></div>
  <div id="msg"></div>
  <div class="ov" id="countOv"><div id="count"></div></div>
  <div class="ov" id="endOv"><div class="card">
    <h2 id="endT"></h2><p id="endP"></p><div class="res" id="endRes"></div>
    <div class="btns"><button id="againBtn">한 번 더! 🔁</button><button class="g" id="toHome">처음으로 🏠</button></div>
  </div></div>
  <button id="homeBtn">🏠</button>
</div>
<script>window.TUIO_DWELL_MS=5000;</script>

};

function computeRects(){const walls=load('walls',null),R={};
  if(walls&&walls.left&&walls.front&&walls.right){const o=viewportOrigin();
    for(const k of WALLS){const s=walls[k];let x0=s.x-o.x,y0=s.y-o.y,x1=x0+s.w,y1=y0+s.h;x0=Math.max(0,x0);y0=Math.max(0,y0);x1=Math.min(W,x1);y1=Math.min(H,y1);

    if(R.left&&R.front&&R.right)return R}
  const w=W/3;WALLS.forEach((k,i)=>R[k]={x:Math.round(i*w),y:0,w:Math.round(w),h:H});return R}

const cv=$('#cv');

renderer.setScissorTest(true);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0d1a33,70,190);
const EYE=new THREE.Vector3(0,GH/2,2.4);
const cams={};
for(const [k,yaw] of [['left',Math.PI/2],['front',0],['right',-Math.PI/2]]){const c=new THREE.PerspectiveCamera(58.7,16/9,.05,500);c.position.copy(EYE);c.rotation.set(0,yaw,0,'YXZ');cams[k]=c;scene.add(c)}
function fitCam(k,r){const c=cams[k],a=r.w/r.h;c.aspect=a;c.fov=THREE.MathUtils.radToDeg(2*Math.atan(1/a));c.updateProjectionMatrix()}

function canvasTex(w,h,draw,repeat){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...repeat)}return t}

// 하늘
{const g=new THREE.SphereGeometry(400,32,16),cols=[],c1=new THREE.Color(0x030713),c2=new THREE.Color(0x1b2f5c),c3=new THREE.Color(0x3a4f80);
  const p=g.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i)/400,c=y>0?c2.clone().lerp(c1,Math.min(1,y*1.6)):c3;cols.push(c.r,c.g,c.b)}
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));scene.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false})))}
// 조명
scene.add(new THREE.HemisphereLight(0xbfd8ff,0x1d3b1d,.9));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(8,30,-4);sun.target.position.set(0,0,-6);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-16,right:16,top:20,bottom:-14,near:1,far:80});sun.shadow.bias=-.0005;scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0xa8c4ff,.6);fill.position.set(-10,12,10);scene.add(fill);

// 잔디 (줄무늬 + 선)
const FX0=-34,FX1=34,FZ0=-60,FZ1=8,PXM=24;
const fieldTex=canvasTex((FX1-FX0)*PXM,(FZ1-FZ0)*PXM,(g,w,h)=>{
  const X=x=>(x-FX0)*PXM,Z=z=>(z-FZ0)*PXM;
  for(let z=FZ0,i=0;z<FZ1;z+=4,i++){g.fillStyle=i%2?'#2f8f3a':'#36a043';g.fillRect(0,Z(z),w,4*PXM)}
  // 잔디 결
  for(let i=0;i<40000;i++){g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,255,255'},.035)`;g.fillRect(Math.random()*w,Math.random()*h,2,6)}
  g.strokeStyle='rgba(255,255,255,.92)';g.lineWidth=.12*PXM;
  const line=(x0,z0,x1,z1)=>{g.beginPath();g.moveTo(X(x0),Z(z0));g.lineTo(X(x1),Z(z1));g.stroke()};
  line(-30,0,30,0);line(-30,0,-30,-55);line(30,0,30,-55);line(-30,-55,30,-55);
  g.strokeRect(X(-9.16),Z(-5.5),18.32*PXM,5.5*PXM);g.strokeRect(X(-20.16),Z(-16.5),40.32*PXM,16.5*PXM);

{const m=new THREE.Mesh(new THREE.PlaneGeometry(FX1-FX0,FZ1-FZ0),new THREE.MeshStandardMaterial({map:fieldTex,roughness:.95}));
  m.rotation.x=-Math.PI/2;m.position.set((FX0+FX1)/2,0,(FZ0+FZ1)/2);m.receiveShadow=true;scene.add(m);

}

// 광고판
function adTex(txt,bg,fg){return canvasTex(2048,128,(g,w,h)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);g.font='900 86px "Malgun Gothic",sans-serif';g.fillStyle=fg;g.textBaseline='middle';
  let x=30;while(x<w){g.fillText(txt,x,h/2+4);x+=g.measureText(txt).width+120}})}
{const ads=[['⚽ 무지개 FC ⚽','#0b5ed7','#fff'],['🧤 슈퍼 골키퍼 🧤','#ffd23f','#0b1a33'],['⭐ 최고의 선방 ⭐','#e11d48','#fff']];
  const mk=(w,x,z,ry,i)=>{const [t,b,f]=ads[i%3];const m=new THREE.Mesh(new THREE.BoxGeometry(w,.9,.15),[0,0,0,0,new THREE.MeshStandardMaterial({map:adTex(t,b,f),emissive:0xffffff,emissiveIntensity:.25,emissiveMap:adTex(t,b,f)}),new THREE.MeshStandardMaterial({color:0x222})].map(x=>x||new THREE.MeshStandardMaterial({color:0x222})));

// 관중석 + 관중
const crowd=[];let crowdMesh;
{const standMat=new THREE.MeshStandardMaterial({color:0x3b4252,roughness:.9}),seatCols=[0xd32f2f,0x1976d2,0xfbc02d,0x388e3c,0xffffff,0xf57c00,0x7b1fa2];
  const addStand=(cx,cz,len,rows,ry)=>{const g=new THREE.Group();g.position.set(cx,0,cz);g.rotation.y=ry;scene.add(g);
    for(let r=0;r<rows;r++){const b=new THREE.Mesh(new THREE.BoxGeometry(len,.6*(r+1),1.1),standMat);b.position.set(0,.3*(r+1),r*1.1+.55);b.receiveShadow=true;g.add(b);
      for(let x=-len/2+.5;x<len/2-.3;x+=.75){if(Math.random()<.1)continue;const p=new THREE.Vector3(x+rnd(-.1,.1),.6*(r+1)+.45,r*1.1+.55);g.localToWorld(p);crowd.push({p,c:seatCols[Math.random()*seatCols.length|0],ph:Math.random()*6,amp:rnd(.15,.35)})}}
    const roof=new THREE.Mesh(new THREE.BoxGeometry(len+2,.3,rows*1.1+2),new THREE.MeshStandardMaterial({color:0x1f2937}));roof.position.set(0,.6*rows+4.5,rows*.55);g.add(roof);g.updateMatrixWorld(true)};
  addStand(0,9,46,11,0);addStand(-37,-24,60,10,-Math.PI/2);addStand(37,-24,60,10,Math.PI/2);addStand(0,-62,70,10,Math.PI);
  const geo=new THREE.CapsuleGeometry(.22,.45,3,8);crowdMesh=new THREE.InstancedMesh(geo,new THREE.MeshLambertMaterial(),crowd.length);
  const m=new THREE.Matrix4(),col=new THREE.Color();crowd.forEach((c,i)=>{m.makeTranslation(c.p.x,c.p.y,c.p.z);crowdMesh.setMatrixAt(i,m);crowdMesh.setColorAt(i,col.setHex(c.c))});scene.add(crowdMesh);

let cheerT=0;
function updCrowd(t){if(cheerT<=0&&Math.floor(t*10)%3)return;const m=new THREE.Matrix4(),heads=crowdMesh.userData.heads;
  crowd.forEach((c,i)=>{const j=cheerT>0?Math.abs(Math.sin(t*9+c.ph))*c.amp*Math.min(1,cheerT):Math.sin(t*1.5+c.ph)*.02;
    m.makeTranslation(c.p.x,c.p.y+j,c.p.z);crowdMesh.setMatrixAt(i,m);m.makeTranslation(c.p.x,c.p.y+.5+j,c.p.z);heads.setMatrixAt(i,m)});

function makeKicker(){const g=new THREE.Group(),skin=new THREE.MeshStandardMaterial({color:0xf1c27d,roughness:.7});
  const shirt=new THREE.MeshStandardMaterial({color:0xd32f2f,roughness:.6}),shorts=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.6}),sock=new THREE.MeshStandardMaterial({color:0xd32f2f}),shoe=new THREE.MeshStandardMaterial({color:0x111111});
  const add=(parent,geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m};
  const body=add(g,new THREE.CapsuleGeometry(.24,.5,4,12),shirt,0,1.28,0);body.scale.set(1,1,.75);
  add(g,new THREE.SphereGeometry(.17,20,16),skin,0,1.83,0);
  const hair=add(g,new THREE.SphereGeometry(.18,20,16,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0x2b1a0e}),0,1.86,-.01);
  add(g,new THREE.CylinderGeometry(.25,.23,.25,16),shorts,0,.92,0);
  const legs=[],arms=[];
  for(const s of [-1,1]){const hip=new THREE.Group();hip.position.set(s*.12,.9,0);g.add(hip);
    add(hip,new THREE.CapsuleGeometry(.085,.36,4,8),skin,0,-.25,0);add(hip,new THREE.CapsuleGeometry(.08,.3,4,8),sock,0,-.6,0);add(hip,new THREE.BoxGeometry(.13,.08,.26),shoe,0,-.84,.06);legs.push(hip);
    const sh=new THREE.Group();sh.position.set(s*.32,1.52,0);g.add(sh);add(sh,new THREE.CapsuleGeometry(.065,.42,4,8),shirt,0,-.25,0);add(sh,new THREE.SphereGeometry(.07,10,8),skin,0,-.52,0);sh.rotation.z=s*.12;arms.push(sh)}
  // 등번호 대신 가슴 별
  const star=add(g,new THREE.CircleGeometry(.09,5),new THREE.MeshBasicMaterial({color:0xffffff}),0,1.38,.19);
  g.userData={legs,arms,shirt,sock,star};g.scale.setScalar(1.12);scene.add(g);return g}

const KIT=[[0xd32f2f,0xffffff],[0x1565c0,0xffffff],[0xf9a825,0x1b1b1b],[0x6a1b9a,0xffffff],[0x00897b,0xffffff],[0xef6c00,0x1b1b1b]];

const G={on:false,phase:'home',t:0,shots:[],idx:0,team:[],ball:null,shake:0};

function toScreen(v){const r=frontPx(),p=v.clone().project(cams.front);return {x:r.x+(p.x+1)/2*r.w,y:r.y+(1-p.y)/2*r.h,z:p.z}}
function makeShots(){const n=CFG.mode==='many'?20:10,S=[];for(let i=0;i<n;i++)S.push({team:CFG.mode==='duo'?i%2:0});return S}
function teamDef(i){return CFG.mode==='duo'?[{name:'빨강',color:'#ef4444',saves:0,goals:0},{name:'파랑',color:'#3b82f6',saves:0,goals:0}][i]:{name:'우리',color:'#16a34a',saves:0,goals:0}}

function start(){ac();relayout();$('#home').classList.remove('on');$('#endOv').classList.remove('on');$('#homeBtn').classList.add('on');$('#hud').classList.add('on');
  ['#sbL','#sbR'].forEach(s=>$(s).classList.add('on'));

  updHud();G.phase='count';let n=3;$('#count').textContent=n;$('#countOv').classList.add('on');sfx.tick();speak('골키퍼 준비!');
  const iv=setInterval(()=>{if(!G.on||G.phase!=='count'){clearInterval(iv);return}n--;if(n>0){$('#count').textContent=n;sfx.tick()}else{clearInterval(iv);$('#countOv').classList.remove('on');sfx.go();prepShot()}},800)}

function prepShot(){const s=G.shots[G.idx],L=LV[CFG.lv],h=HT[CFG.ht];
  s.gx=rnd(-GW/2+.45,GW/2-.45);s.gy=rnd(h[0],h[1]);s.T=rnd(...L.T);s.arc=rnd(...L.arc)*(s.gy>1.6?.5:1);s.curve=L.curve?rnd(-L.curve,L.curve):0;
  s.sx=rnd(-.15,.15);
  const [c1,c2]=KIT[Math.random()*KIT.length|0];kicker.userData.shirt.color.setHex(c1);kicker.userData.sock.color.setHex(c1);kicker.userData.star.material.color.setHex(c2);
  kicker.position.set(s.sx-2.2,0,SPOT-2.6);kicker.rotation.y=.7;ball.position.set(s.sx,BR,SPOT);ball.visible=true;trail.forEach(t=>t.visible=false);
  marker.position.set(s.gx,s.gy,.02);markerIn.position.copy(marker.position);marker.material.opacity=0;markerIn.material.opacity=0;
  G.phase='ready';G.t=0;G.saved=false;G.goal=false;updHud();

function launchBall(){sfx.kick();G.phase='flight';G.t=0;const s=G.shots[G.idx];s.S=new THREE.Vector3(s.sx,BR,SPOT);s.G=new THREE.Vector3(s.gx,s.gy,0)}
function ballAt(s,u){const p=s.S.clone().lerp(s.G,u);p.y+=s.arc*4*u*(1-u);p.x+=s.curve*4*u*(1-u);return p}

function checkSave(){const s=G.shots[G.idx],L=LV[CFG.lv],r=frontPx(),now=performance.now();
  const bs=toScreen(ball.position),edge=toScreen(ball.position.clone().add(new THREE.Vector3(BR,0,0))),br=Math.abs(edge.x-bs.x);
  const tol=br+L.tol*r.h;
  for(const p of ptrs.values()){if(p.up&&now-p.up>160)continue;if(p.x<r.x||p.x>r.x+r.w||p.y<r.y||p.y>r.y+r.h)continue;
    if(Math.hypot(p.x-bs.x,p.y-bs.y)<tol){return p}}
  return null}

function onSave(p){const s=G.shots[G.idx];G.saved=true;G.phase='after';G.t=0;sfx.save();setTimeout(()=>sfx.cheer(),80);cheerT=2.6;

  const d=new THREE.Vector3(ball.position.x-(s.gx),0,0);G.vel=new THREE.Vector3(rnd(-3,3)+Math.sign(ball.position.x||1)*2,rnd(3,5.5),-rnd(7,10));

function glove(x,y){const r=frontPx(),d=document.createElement('div');d.className='glove';d.textContent='🧤';d.style.left=(x-r.x)+'px';d.style.top=(y-r.y)+'px';$('#ui').appendChild(d);setTimeout(()=>d.remove(),950)}
function flash(t,sub,color){const m=$('#msg');m.innerHTML=t+(sub?`<small>${sub}</small>`:'');m.style.color=color||'#fff';m.classList.remove('show');void m.offsetWidth;m.classList.add('show')}
function updHud(){const n=G.shots.length,i=Math.min(G.idx+1,n),s=G.shots[Math.min(G.idx,n-1)];

  else{$('#sbBig').textContent=`${sv} : ${gl}`;$('#sbSub').textContent='선방 : 골'}
  $('#sbDots').textContent=G.results.map(r=>r.ok?'🧤':'⚽').join('');
  $('#nxBig').textContent=Math.min(G.idx+1,n);$('#nxSub').textContent=`번째 공 (모두 ${n}개)`}

function nextShot(){G.idx++;if(G.idx>=G.shots.length){finish();return}prepShot()}
function finish(){G.on=false;G.phase='end';$('#hud').classList.remove('on');$('#homeBtn').classList.remove('on');ball.visible=false;trail.forEach(t=>t.visible=false);
  const box=$('#endRes');box.innerHTML='';

  if(CFG.mode==='duo'){const [a,b]=G.team;if(a.saves===b.saves){$('#endT').textContent='비겼어요! 🤝';speak('비겼어요! 둘 다 최고의 골키퍼예요!')}
    else{const w=a.saves>b.saves?a:b;$('#endT').innerHTML=`<span style="color:${w.color}">${w.name}</span> 팀 승리! 🏆`;speak(`${w.name} 팀 승리! 모두 멋진 골키퍼예요!`)}
    $('#endP').textContent='모두 멋진 골키퍼예요!'}
  else{const t=G.team[0],n=G.shots.length,r=t.saves/n;$('#endT').textContent=`${t.saves}개 막았어요! ${r>=.8?'🏆':r>=.5?'🎉':'👍'}`;
    $('#endP').textContent=r>=.8?'우와! 국가대표 골키퍼예요!':r>=.5?'멋진 골키퍼예요!':'잘했어요! 다음엔 더 많이 막아 봐요!';speak(`${t.saves}개 막았어요! ${$('#endP').textContent}`)}

/* ---------- 키커 동작 ---------- */
function poseKicker(phase,t){const {legs,arms}=kicker.userData,s=G.shots[G.idx];
  if(phase==='ready'){legs[0].rotation.x=legs[1].rotation.x=0;arms[0].rotation.x=arms[1].rotation.x=0;kicker.position.y=0;return}
  if(phase==='runup'){const u=clamp(t/1.0,0,1),from=new THREE.Vector3(s.sx-2.2,0,SPOT-2.6),to=new THREE.Vector3(s.sx-.45,0,SPOT-.55);
    kicker.position.lerpVectors(from,to,u);kicker.rotation.y=.7*(1-u)+.15*u;const sw=Math.sin(t*16)*.7;
    legs[0].rotation.x=sw;legs[1].rotation.x=-sw;arms[0].rotation.x=-sw*.8;arms[1].rotation.x=sw*.8;kicker.position.y=Math.abs(Math.sin(t*16))*.06;return}
  if(phase==='kick'){const u=clamp(t/.22,0,1);legs[1].rotation.x=-.9+u*2.1;legs[0].rotation.x=.15;arms[0].rotation.x=-.9*u;arms[1].rotation.x=.6*u;return}
  // 공 찬 뒤: 천천히 원래 자세
  const {legs:L,arms:A}=kicker.userData;for(const p of [...L,...A])p.rotation.x*=.9}

/* ---------- 루프 ---------- */
let last=performance.now(),clock=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  cheerT=Math.max(0,cheerT-dt);G.shake=Math.max(0,G.shake-dt*2.5);
  if(G.on){G.t+=dt;const s=G.shots[G.idx],L=LV[CFG.lv];
    if(G.phase==='ready'){poseKicker('ready');if(G.t>1.1){G.phase='runup';G.t=0;sfx.whistle()}}
    else if(G.phase==='runup'){poseKicker('runup',G.t);if(G.t>=1.0){G.phase='kick';G.t=0}}
    else if(G.phase==='kick'){poseKicker('kick',G.t);if(G.t>=.16){launchBall()}}
    else if(G.phase==='flight'){poseKicker('after');const u=G.t/s.T;
      const p=ballAt(s,Math.min(u,1.08));ball.position.copy(p);ball.rotation.x-=dt*14;ball.rotation.z+=dt*s.curve*6;
      for(let i=trail.length-1;i>0;i--){trail[i].position.copy(trail[i-1].position);trail[i].visible=trail[i-1].visible}trail[0].position.copy(p);trail[0].visible=CFG.lv>0||u>.1;
      // 도착 표시
      const show=u>1-L.mark;const a=show?Math.min(1,(u-(1-L.mark))*6):0;marker.material.opacity=a*.95;markerIn.material.opacity=a*.25;
      const pulse=1+Math.sin(clock*12)*.08;marker.scale.setScalar(pulse);
      if(G.t>=s.T-L.win){const hit=checkSave();if(hit){onSave(hit)}}
      if(G.phase==='flight'&&u>=1.04){onGoal()}}
    else if(G.phase==='after'){poseKicker('after');marker.material.opacity*=.85;markerIn.material.opacity*=.85;
      if(G.saved){G.vel.y-=9.8*dt;ball.position.addScaledVector(G.vel,dt);if(ball.position.y<BR){ball.position.y=BR;G.vel.y*=-.45;G.vel.x*=.8;G.vel.z*=.8}ball.rotation.x+=dt*10}
      else{// 골: 공이 화면 앞으로 다가왔다가 사라짐
        const d=new THREE.Vector3().subVectors(s.G,s.S).normalize();ball.position.addScaledVector(d,dt*6*Math.max(0,1-G.t*1.5));if(G.t>.45)ball.visible=false}
      for(let i=trail.length-1;i>=0;i--)trail[i].visible=false;
      if(G.t>1.9)nextShot()}}
  else if(G.phase==='home'){// 대기 화면: 키커가 공을 툭툭
    ball.visible=true;const u=(clock*1.3)%2;kicker.position.set(-1.2,0,SPOT-1.5);kicker.rotation.y=.4+Math.sin(clock*.5)*.2;
    ball.position.set(-1.0+Math.sin(clock*.9)*.3,BR+Math.abs(Math.sin(clock*3.2))*1.1,SPOT-1);ball.rotation.x+=dt*4;
    const {legs}=kicker.userData;legs[1].rotation.x=Math.sin(clock*3.2)*.4;legs[0].rotation.x=0}
  updCrowd(clock);
  if(!NORENDER)render();
  requestAnimationFrame(loop)}
const NORENDER=/norender/.test(location.search);
function render(){
  // 화면 그리기 (벽 3개 = 카메라 3개, 90도씩)
  for(const k of WALLS){const r=RECTS[k];if(!r)continue;const c=cams[k];c.position.copy(EYE);
    if(G.shake){c.position.x+=(Math.random()-.5)*.04*G.shake;c.position.y+=(Math.random()-.5)*.04*G.shake}
    renderer.setViewport(r.x,H-r.y-r.h,r.w,r.h);renderer.setScissor(r.x,H-r.y-r.h,r.w,r.h);renderer.render(scene,c)}}
window.__render=render;

  document.documentElement.style.setProperty('--u',(RECTS.front.w/100)+'px');for(const k of WALLS)fitCam(k,RECTS[k])}
function resize(){W=innerWidth;H=innerHeight;renderer.setSize(W,H,false);relayout()}
addEventListener('resize',resize);
let lastPos='';setInterval(()=>{const p=screenX+','+screenY;if(p!==lastPos){lastPos=p;relayout()}},1000);
function syncOpts(){document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',String(CFG[b.dataset.k])===b.dataset.v))}
document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{ac();const k=b.dataset.k;CFG[k]=k==='mode'?b.dataset.v:+b.dataset.v;save('cfg',CFG);syncOpts();sfx.tick()}));
$('#startBtn').addEventListener('click',start);$('#againBtn').addEventListener('click',start);
$('#toHome').addEventListener('click',goHome);$('#homeBtn').addEventListener('click',goHome);
addEventListener('keydown',e=>{if(e.key==='Escape')goHome()});
document.addEventListener('contextmenu',e=>e.preventDefault());
window.G=G;window.ball=ball;window.toScreen=toScreen;
resize();syncOpts();goHome();requestAnimationFrame(loop);
</script>
</body>
</html>
