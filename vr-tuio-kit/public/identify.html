<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>모니터 확인</title>
<style>html,body{margin:0;height:100%;background:#1d3557;color:#fff;font-family:'Malgun Gothic',sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column}
b{font-size:40vh;line-height:1}p{font-size:4vh;opacity:.8;margin:0}</style></head>
<body><b id="n"></b><p id="d"></p><p>이 번호를 config.json "monitor"에 적는다 · 아무 키나 누르면 닫힘</p>
<script>const q=new URLSearchParams(location.search);document.getElementById('n').textContent=q.get('n');document.getElementById('d').textContent=q.get('info')||'';
addEventListener('keydown',()=>window.close());</script></body></html>
