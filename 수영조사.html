<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏊 수영참여 조사</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f8ff;--card:#fff;--border:#d0e8f8;--pri:#3a9bd5;--dark:#2178b0;--light:#e8f5fd;--text:#1a3a4a;--sub:#4a7a96;--muted:#8aafc4;--swim:#3a9bd5;--indoor:#f4a85a;--absent:#9e9e9e;--attend:#5cb85c;--off:#e87aa3;--leave:#f4a85a;--sh:0 4px 16px rgba(58,155,213,.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:linear-gradient(135deg,#b8dff5,#e0f3fd);padding:26px 20px 44px;position:relative;overflow:hidden;border-bottom:1px solid var(--border);}
header::before{content:'🏊';position:absolute;top:10px;right:18px;font-size:5rem;opacity:.13;}
header::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:28px;background:var(--bg);clip-path:ellipse(55% 100% at 50% 100%);}
.hi{max-width:640px;margin:0 auto;position:relative;z-index:1;}
h1{font-size:1.6rem;font-weight:900;color:#0d3a5c;}
.hsub{color:var(--dark);font-size:.84rem;margin-top:5px;}
.hdate{margin-top:10px;display:inline-block;padding:5px 14px;background:rgba(255,255,255,.6);border-radius:20px;font-size:.8rem;color:#0d3a5c;font-weight:700;}
main{max-width:640px;margin:0 auto;padding:0 14px 100px;}
/* 탭 */
.mtabs{display:flex;margin-bottom:18px;background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--sh);}
.mtab{flex:1;padding:15px 8px;border:none;font-family:inherit;font-size:.88rem;font-weight:800;cursor:pointer;background:#fff;color:var(--sub);transition:all .15s;}
.mtab.on{background:var(--pri);color:#fff;}
/* 카드 */
.card{background:var(--card);border-radius:16px;padding:20px 18px;box-shadow:var(--sh);margin-bottom:13px;border:1px solid var(--border);}
.ctitle{font-size:.96rem;font-weight:800;color:var(--text);margin-bottom:3px;}
.csub{font-size:.76rem;color:var(--sub);margin-bottom:14px;}
/* 기관탭 */
.itabs{display:flex;gap:7px;margin-bottom:13px;}
.itab{flex:1;padding:10px;background:#fff;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:.8rem;font-weight:700;color:var(--sub);cursor:pointer;transition:all .13s;}
.itab.on{background:var(--pri);border-color:var(--pri);color:#fff;}
/* 반 */
.cgroup{margin-bottom:11px;}
.cgtitle{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.7px;margin-bottom:7px;padding-left:3px;}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px;}
.cbtn{padding:11px 6px;background:#fff;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:.83rem;font-weight:700;color:var(--text);cursor:pointer;text-align:center;transition:all .13s;}
.cbtn:hover{border-color:var(--pri);background:var(--light);}
.cbtn.on{background:var(--pri);border-color:var(--pri);color:#fff;}
/* 진행바 */
.pbar-wrap{margin-bottom:14px;}
.pbar-txt{font-size:.76rem;color:var(--sub);margin-bottom:5px;display:flex;justify-content:space-between;}
.pbar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;}
.pfill{height:100%;border-radius:99px;transition:width .3s;background:var(--pri);}
.pfill.g{background:var(--attend);}
/* 아동행 */
.clist{display:flex;flex-direction:column;gap:9px;}
.crow{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--light);border-radius:11px;border:1px solid var(--border);}
.cname{font-weight:700;min-width:50px;font-size:.9rem;}
.sbtns{display:flex;gap:5px;flex:1;}
.sb{flex:1;padding:9px 3px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.7rem;font-weight:800;cursor:pointer;background:#fff;color:var(--sub);text-align:center;transition:all .12s;}
.sb.sw.on{background:var(--swim);border-color:var(--swim);color:#fff;}
.sb.id.on{background:var(--indoor);border-color:var(--indoor);color:#fff;}
.sb.ab.on{background:var(--absent);border-color:var(--absent);color:#fff;}
/* 교사행 */
.tgroup{margin-bottom:16px;}
.tgtitle{font-size:.78rem;font-weight:800;color:var(--sub);padding:6px 10px;background:var(--light);border-radius:8px;margin-bottom:9px;}
.trow{padding:11px 13px;background:var(--light);border-radius:11px;border:1px solid var(--border);margin-bottom:7px;transition:border-color .2s;}
.trow.saved{border-color:var(--attend);}
.trow-top{display:flex;align-items:center;gap:9px;}
.tinfo{min-width:64px;}
.tname{font-weight:700;font-size:.88rem;}
.trole{font-size:.66rem;color:var(--muted);margin-top:1px;}
.tbtns{display:flex;gap:5px;flex:1;}
.tb{flex:1;padding:9px 3px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.7rem;font-weight:800;cursor:pointer;background:#fff;color:var(--sub);text-align:center;transition:all .12s;}
.tb.at.on{background:var(--attend);border-color:var(--attend);color:#fff;}
.tb.of.on{background:var(--off);border-color:var(--off);color:#fff;}
.tb.lv.on{background:var(--leave);border-color:var(--leave);color:#fff;}
.ldet{margin-top:8px;padding:9px 11px;background:#fff5e0;border:1px dashed var(--leave);border-radius:9px;display:none;}
.ldet.show{display:block;}
.ldlbl{font-size:.7rem;font-weight:700;color:#c06000;margin-bottom:7px;}
.lsubs{display:flex;gap:5px;}
.lsb{flex:1;padding:8px 3px;border:1.5px solid #f4c87a;border-radius:8px;font-family:inherit;font-size:.68rem;font-weight:800;cursor:pointer;background:#fff;color:#c06000;text-align:center;transition:all .12s;}
.lsb.on{background:var(--leave);border-color:var(--leave);color:#fff;}
.tsave-ok{font-size:.7rem;color:var(--attend);font-weight:700;margin-top:5px;display:none;}
.tsave-ok.show{display:block;}
/* 버튼 */
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-family:inherit;font-size:.96rem;font-weight:800;cursor:pointer;transition:all .14s;margin-top:4px;}
.btn-pri{background:var(--pri);color:#fff;}
.btn-pri:hover{background:var(--dark);}
.btn-pri:disabled{background:var(--muted);cursor:not-allowed;}
.btn-sec{background:#fff;color:var(--sub);border:1.5px solid var(--border);margin-bottom:7px;}
/* 알림 */
.amsg{background:linear-gradient(135deg,#fff8e1,#fff3c4);border:1px solid #ffd966;padding:11px 13px;border-radius:10px;margin-bottom:12px;display:none;}
.amsg.show{display:block;}
.amsg b{color:#7a5a00;font-size:.83rem;}
.amsg p{color:#7a5a00;font-size:.74rem;margin-top:2px;}
/* 완료 */
.done{text-align:center;padding:34px 20px;background:linear-gradient(135deg,#e8f5fd,#d0ecfa);border:1px solid var(--border);}
.dicon{width:66px;height:66px;border-radius:50%;background:#5cb85c;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;}
.dtitle{font-size:1.15rem;font-weight:900;margin-bottom:7px;}
.dsub{color:var(--sub);font-size:.86rem;line-height:1.6;}
/* 토스트 */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:28px;font-size:.84rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
/* 교사 요약 */
.t-summary{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.ts-badge{flex:1;min-width:70px;padding:10px;background:#fff;border:1px solid var(--border);border-radius:10px;text-align:center;box-shadow:var(--sh);}
.ts-num{font-size:1.4rem;font-weight:900;color:var(--text);}
.ts-lbl{font-size:.68rem;color:var(--sub);margin-top:2px;font-weight:700;}
@media(max-width:460px){h1{font-size:1.38rem;}.cname,.tname{font-size:.8rem;}.sb,.tb,.lsb{font-size:.62rem;padding:8px 2px;}.mtab{font-size:.8rem;padding:13px 5px;}}
</style>
</head>
<body>
<header>
  <div class="hi">
    <h1>🏊 수영참여 조사</h1>
    <p class="hsub">무지개어린이집 · 우리무지개어린이집 Funday 수영</p>
    
  </div>
</header>
<main>
  <div class="mtabs">
    <button class="mtab on" id="tabC" onclick="showTab('child')">🧒 아동 참여</button>
    <button class="mtab"    id="tabT" onclick="showTab('teacher')">👩‍🏫 교사 참여</button>
  </div>

  <!-- 아동 섹션 -->
  <div id="secChild">
    <div id="c_step1" class="card">
      <div class="ctitle">반을 선택해 주세요</div>
      <div class="csub">담당 반을 선택하세요.</div>
      <div class="itabs">
        <button class="itab on" id="iA" onclick="selInst('A')">무지개어린이집</button>
        <button class="itab"    id="iB" onclick="selInst('B')">우리무지개어린이집</button>
      </div>
      <div id="classWrap"></div>
    </div>
    <div id="c_step2" style="display:none;">
      <div id="c_already" class="amsg">
        <b>⚠️ 오늘 이미 제출된 내용이 있어요</b>
        <p>기존 입력이 표시됩니다. 수정 후 재제출하면 덮어쓰기됩니다.</p>
      </div>
      <div class="card">
        <div class="ctitle" id="c_title"></div>
        <div class="csub"   id="c_sub"></div>
        <div class="pbar-wrap">
          <div class="pbar-txt"><span id="c_ptxt">0 / 0명</span><span id="c_ppct">0%</span></div>
          <div class="pbar"><div class="pfill" id="c_pfill" style="width:0%"></div></div>
        </div>
        <div class="clist" id="childList"></div>
      </div>
      <button class="btn btn-sec" onclick="c_back()">⬅ 반 다시 선택</button>
    </div>
  </div>

  <!-- 교사 섹션 -->
  <div id="secTeacher" style="display:none;">
    <div id="t_already" class="amsg">
      <b>⚠️ 오늘 이미 입력된 교사 데이터가 있어요</b>
      <p>버튼을 누르면 자동 저장됩니다.</p>
    </div>
    <div class="card">
      <div class="ctitle">교사 참여 여부</div>
      <div class="csub">버튼을 누르면 즉시 저장됩니다.</div>
      <div class="pbar-wrap">
        <div class="pbar-txt"><span id="t_ptxt">0 / 0명 입력</span><span id="t_ppct">0%</span></div>
        <div class="pbar"><div class="pfill g" id="t_pfill" style="width:0%"></div></div>
      </div>
      <div class="t-summary">
        <div class="ts-badge"><div class="ts-num" id="ts_att">0</div><div class="ts-lbl">✅ 참여</div></div>
        <div class="ts-badge"><div class="ts-num" id="ts_off">0</div><div class="ts-lbl">❌ 불참</div></div>
        <div class="ts-badge"><div class="ts-num" id="ts_lv">0</div><div class="ts-lbl">🏖️ 당일휴가</div></div>
        <div class="ts-badge"><div class="ts-num" id="ts_none">0</div><div class="ts-lbl">⬜ 미입력</div></div>
      </div>
      <div id="teacherList"></div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FC = {
  apiKey:"AIzaSyDojXJ_9pOnla8uG240APwo3Ik9gBddMw4",
  authDomain:"mujigae-swimming.firebaseapp.com",
  databaseURL:"https://mujigae-swimming-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"mujigae-swimming"
};
const fbApp = initializeApp(FC);
const db = getDatabase(fbApp);

const TODAY = new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});


const ROSTER = {
  A:{name:"무지개어린이집",groups:[
    {title:"영아반",classes:{
      "아기참새":["박범준","정윤하","정다엘","고이솔","조은준"],
      "초롱이슬":["전유주","양선우","박하엘","박유하","정이안","정이준"]
    }},
    {title:"유아반",classes:{
      "은빛물결":["이재헌","박수현","김성원","정하준","송지우","박승빈","김정후","주현우","신승혁","김수호","정연우","최보민","한다윤"]
    }}
  ]},
  B:{name:"우리무지개어린이집",groups:[
    {title:"유아반",classes:{
      "아침햇살":["정태호","고은호","김이안","전수호","위단우","서현우","김윤우","김지안"],
      "들꽃향기":["한지후","박은진","곽시안","박찬율","설재은","류시환","강은호","박다엘","김사랑","손리완","이로아","이소민","방서윤","김인우","이은우","임서우","이하린"],
      "고운햇살":["박재희","박지유","김민준","곽나율","김은서","홍하루","김동휘","임라희"],
      "푸른하늘":["김아린","김강준","박진우","한서후","윤태언","김서우","백민지","이하민","강태희","곽다온","박준","김세윤","김지민","이채민"],
      "파도소리":["윤지아","김수겸","돌란샤나","권민서","최도윤","장시영"],
      "푸른바다":["김평온","김별리","양준우","강지호","김도우","백이엘","이태헌","오주원","서연석","임하라","김태유","조믿음","유이서","윤예나","윤예지","조가온","곽시후","이소민"]
    }}
  ]}
};

const TGROUPS = [
  {title:"🏠 무지개어린이집",list:[
    {n:"우지선",r:"아기참새"},{n:"정선윤",r:"초롱이슬"},
    {n:"채준범",r:"은빛물결"},{n:"이왕성",r:"은빛물결"},{n:"서명화",r:"은빛물결"},{n:"임민주",r:"은빛물결"},
    {n:"황경하",r:"드림(방과후)"},{n:"이승원",r:"드림(방과후)"},{n:"박정민",r:"드림(방과후)"},
    {n:"주은아",r:"연장반"},{n:"윤혜정",r:"연장반"},
    {n:"강수민",r:"치료사"},{n:"서홍련",r:"치료사"},{n:"정소윤",r:"치료사"}
  ]},
  {title:"🏠 우리무지개어린이집",list:[
    {n:"강수지",r:"아침햇살"},{n:"김보라",r:"아침햇살"},{n:"김하민",r:"아침햇살"},
    {n:"박서정",r:"고운햇살"},{n:"천은주",r:"고운햇살"},{n:"모정아",r:"고운햇살"},
    {n:"박초롱",r:"들꽃향기"},{n:"이효선",r:"들꽃향기"},
    {n:"조현아",r:"푸른하늘"},{n:"황선하",r:"푸른하늘"},
    {n:"임정연",r:"파도소리"},{n:"조명원",r:"파도소리"},
    {n:"백장미",r:"푸른바다"},{n:"이슬아",r:"푸른바다"},{n:"유주환",r:"푸른바다"},
    {n:"송태헌",r:"다짐(방과후)"},{n:"마호진",r:"다짐(방과후)"},
    {n:"정인애",r:"모둠(방과후)"},{n:"변아진",r:"모둠(방과후)"},{n:"윤아름",r:"모둠(방과후)"},{n:"정다송",r:"모둠(방과후)"},
    {n:"이미화",r:"치료사"},{n:"권다애",r:"치료사"},{n:"표영민",r:"치료사"},
    {n:"전나인",r:"치료사"},{n:"박규리",r:"치료사"},{n:"임주현",r:"치료사"}
  ]}
];
const ALL_T = TGROUPS.flatMap(g => g.list);

// ── 상태 ─────────────────────────────────────────────────
let C = {inst:'A', cls:'', ch:{}, grp:''};
let TS = {};  // {name: {s:'attend'|'off'|'leave', lt:'am'|'pm'|'all'}}
let tInited = false;

// ── 유틸 ─────────────────────────────────────────────────
const $= id => document.getElementById(id);
const toast = msg => {
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
};

// ── 탭 전환 ──────────────────────────────────────────────
window.showTab = function(tab) {
  $('tabC').classList.toggle('on', tab==='child');
  $('tabT').classList.toggle('on', tab==='teacher');
  $('secChild').style.display   = tab==='child'   ? 'block':'none';
  $('secTeacher').style.display = tab==='teacher' ? 'block':'none';
  if (tab==='teacher' && !tInited) t_init();
};

// ══════════════════════════════════════════════════════════
// 아동 입력
// ══════════════════════════════════════════════════════════
window.selInst = function(k) {
  C.inst=k; C.cls='';
  $('iA').classList.toggle('on',k==='A');
  $('iB').classList.toggle('on',k==='B');
  renderClasses();
};

function renderClasses() {
  let html='';
  ROSTER[C.inst].groups.forEach(g=>{
    html+=`<div class="cgroup"><div class="cgtitle">${g.title}</div><div class="cgrid">`;
    Object.keys(g.classes).forEach(c=>{
      html+=`<button class="cbtn" onclick="selClass('${c}')">${c}</button>`;
    });
    html+=`</div></div>`;
  });
  $('classWrap').innerHTML=html;
}

window.selClass = async function(c) {
  C.cls=c; C.ch={};
  ROSTER[C.inst].groups.forEach(g=>{ if(g.classes[c]) C.grp=g.title; });
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.toggle('on', b.textContent===c));
  try {
    const snap = await get(ref(db,`swimming_survey/${TODAY}_${c}`));
    if(snap.exists()&&snap.val().children){ C.ch={...snap.val().children}; $('c_already').classList.add('show'); }
    else $('c_already').classList.remove('show');
  } catch(e){ $('c_already').classList.remove('show'); }
  $('c_title').textContent = `${c}`;
  $('c_sub').textContent   = `${ROSTER[C.inst].name} · ${C.grp}`;
  renderChildren();
  $('c_step1').style.display='none'; $('c_step2').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
};

window.c_back = function() {
  $('c_step2').style.display='none'; $('c_step1').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
};

function renderChildren() {
  let kids=[];
  ROSTER[C.inst].groups.forEach(g=>{ if(g.classes[C.cls]) kids=g.classes[C.cls]; });
  $('childList').innerHTML = kids.map(nm=>{
    const cur=C.ch[nm]||'';
    return `<div class="crow" id="cr_${nm}">
      <div class="cname">${nm}</div>
      <div class="sbtns">
        <button class="sb sw${cur==='swim'?' on':''}" onclick="setCS('${nm}','swim')">🏊 수영</button>
        <button class="sb id${cur==='indoor'?' on':''}" onclick="setCS('${nm}','indoor')">🏠 원내보육</button>
        <button class="sb ab${cur==='absent'?' on':''}" onclick="setCS('${nm}','absent')">❌ 결석</button>
      </div>
      <div class="tsave-ok${cur?' show':''}" id="ok_c_${nm}">✓</div>
    </div>`;
  }).join('');
  updateCP(kids);
}

window.setCS = async function(nm, st) {
  C.ch[nm]=st;
  const row=$(`cr_${nm}`);
  if(row){
    row.querySelector('.sb.sw').classList.toggle('on',st==='swim');
    row.querySelector('.sb.id').classList.toggle('on',st==='indoor');
    row.querySelector('.sb.ab').classList.toggle('on',st==='absent');
  }
  let kids=[]; ROSTER[C.inst].groups.forEach(g=>{ if(g.classes[C.cls]) kids=g.classes[C.cls]; });
  updateCP(kids);
  // 즉시저장
  try {
    await set(ref(db,`swimming_survey/${TODAY}_${C.cls}`),{
      inst:C.inst, instName:ROSTER[C.inst].name, cls:C.cls, date:TODAY,
      children:C.ch, submittedAt:new Date().toISOString()
    });
    const ok=$(`ok_c_${nm}`); if(ok){ ok.classList.add('show'); }
  } catch(e){ toast('저장 실패. 다시 눌러주세요.'); }
};

function updateCP(kids) {
  const total=kids.length, done=kids.filter(n=>!!C.ch[n]).length;
  const pct=total?Math.round(done/total*100):0;
  $('c_ptxt').textContent=`${done} / ${total}명 입력`;
  $('c_ppct').textContent=`${pct}%`;
  $('c_pfill').style.width=pct+'%';

}



// ══════════════════════════════════════════════════════════
// 교사 입력 (즉시저장)
// ══════════════════════════════════════════════════════════
async function t_init() {
  tInited=true;
  ALL_T.forEach(t=>{ TS[t.n]={s:'',lt:''}; });
  try {
    const snap=await get(ref(db,`swimming_survey/teachers_${TODAY}`));
    if(snap.exists()&&snap.val().teachers){
      const sv=snap.val().teachers;
      ALL_T.forEach(t=>{ if(sv[t.n]) TS[t.n]={s:sv[t.n].s||'',lt:sv[t.n].lt||''}; });
      $('t_already').classList.add('show');
    }
  } catch(e){}
  renderTeachers();
}

function renderTeachers() {
  const container=$('teacherList');
  container.innerHTML='';
  TGROUPS.forEach(g=>{
    const gDiv=document.createElement('div');
    gDiv.className='tgroup';
    gDiv.innerHTML=`<div class="tgtitle">${g.title}</div>`;
    g.list.forEach(t=>{
      const st=TS[t.n]||{s:'',lt:''};
      const div=document.createElement('div');
      div.className='trow'+(st.s?(' saved'):'');
      div.id=`tr_${t.n}`;
      div.innerHTML=`
        <div class="trow-top">
          <div class="tinfo"><div class="tname">${t.n}</div><div class="trole">${t.r}</div></div>
          <div class="tbtns">
            <button class="tb at${st.s==='attend'?' on':''}" id="tb_at_${t.n}" onclick="setTS('${t.n}','attend')">✅ 참여</button>
            <button class="tb of${st.s==='off'?' on':''}"    id="tb_of_${t.n}" onclick="setTS('${t.n}','off')">❌ 불참</button>
            <button class="tb lv${st.s==='leave'?' on':''}"  id="tb_lv_${t.n}" onclick="setTS('${t.n}','leave')">🏖️ 당일휴가</button>
          </div>
        </div>
        <div class="ldet${st.s==='leave'?' show':''}" id="ld_${t.n}">
          <div class="ldlbl">휴가 유형을 선택하세요</div>
          <div class="lsubs">
            <button class="lsb${st.lt==='am'?' on':''}"  id="lsb_am_${t.n}"  onclick="setLT('${t.n}','am')">🌅 오전반차</button>
            <button class="lsb${st.lt==='pm'?' on':''}"  id="lsb_pm_${t.n}"  onclick="setLT('${t.n}','pm')">🌇 오후반차</button>
            <button class="lsb${st.lt==='all'?' on':''}" id="lsb_all_${t.n}" onclick="setLT('${t.n}','all')">☀️ 종일휴가</button>
          </div>
        </div>
        <div class="tsave-ok${st.s?(' show'):''}" id="ok_${t.n}">✓ 저장됨</div>`;
      gDiv.appendChild(div);
    });
    container.appendChild(gDiv);
  });
  updateTP();
}

// 교사 상태 저장 (즉시)
async function saveTeachers() {
  const data={};
  ALL_T.forEach(t=>{ data[t.n]={s:TS[t.n].s, lt:TS[t.n].lt}; });
  await set(ref(db,`swimming_survey/teachers_${TODAY}`),{
    date:TODAY, teachers:data, submittedAt:new Date().toISOString()
  });
}

window.setTS = async function(nm, st) {
  if(!TS[nm]) TS[nm]={s:'',lt:''};
  TS[nm].s=st;
  if(st!=='leave') TS[nm].lt='';
  // UI 업데이트
  const row=$(`tr_${nm}`);
  if(row){
    [`at_${nm}`,`of_${nm}`,`lv_${nm}`].forEach(id=>{ const b=$(id.replace(/^/,'tb_')); if(b) b.classList.remove('on'); });
    $(`tb_at_${nm}`).classList.toggle('on',st==='attend');
    $(`tb_of_${nm}`).classList.toggle('on',st==='off');
    $(`tb_lv_${nm}`).classList.toggle('on',st==='leave');
    const ld=$(`ld_${nm}`);
    if(ld){ ld.classList.toggle('show',st==='leave'); if(st!=='leave') [`am`,`pm`,`all`].forEach(lt=>{ const b=$(`lsb_${lt}_${nm}`); if(b) b.classList.remove('on'); }); }
    row.classList.toggle('saved',!!st);
  }
  updateTP();
  try { await saveTeachers(); showOk(nm); } catch(e){ toast('저장 실패. 다시 눌러주세요.'); }
};

window.setLT = async function(nm, lt) {
  if(!TS[nm]) TS[nm]={s:'leave',lt:''};
  TS[nm].lt=lt;
  [`am`,`pm`,`all`].forEach(k=>{ const b=$(`lsb_${k}_${nm}`); if(b) b.classList.toggle('on',k===lt); });
  updateTP();
  try { await saveTeachers(); showOk(nm); } catch(e){ toast('저장 실패. 다시 눌러주세요.'); }
};

function showOk(nm){
  const ok=$(`ok_${nm}`); if(!ok) return;
  ok.classList.add('show');
}

function updateTP() {
  const total=ALL_T.length;
  const att=ALL_T.filter(t=>TS[t.n]?.s==='attend').length;
  const off=ALL_T.filter(t=>TS[t.n]?.s==='off').length;
  const lv =ALL_T.filter(t=>TS[t.n]?.s==='leave').length;
  const done=ALL_T.filter(t=>{ const s=TS[t.n]; if(!s||!s.s) return false; if(s.s==='leave') return !!s.lt; return true; }).length;
  const none=total-done;
  const pct=Math.round(done/total*100);
  $('t_ptxt').textContent=`${done} / ${total}명 입력`;
  $('t_ppct').textContent=`${pct}%`;
  $('t_pfill').style.width=pct+'%';
  $('ts_att').textContent=att;
  $('ts_off').textContent=off;
  $('ts_lv').textContent=lv;
  $('ts_none').textContent=none;
}

// 초기화
selInst('A');
</script>
