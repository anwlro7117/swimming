<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏊 수영참여 현황</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f0f8ff; --card: #ffffff; --border: #d0e8f8;
    --primary: #3a9bd5; --primary-dark: #2178b0;
    --accent: #a8d8f0; --light: #e8f5fd;
    --text: #1a3a4a; --sub: #4a7a96; --muted: #8aafc4;
    --swim: #3a9bd5; --indoor: #f4a85a; --absent: #9e9e9e;
    --green: #5cb85c; --shadow: 0 4px 16px rgba(58,155,213,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* 로그인 */
  #loginOverlay {
    position: fixed; inset: 0; background: rgba(224,243,253,0.97);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; backdrop-filter: blur(8px);
  }
  .login-box {
    background: #fff; padding: 36px 30px; border-radius: 20px;
    max-width: 320px; width: calc(100%-40px); text-align: center;
    box-shadow: 0 20px 60px rgba(58,155,213,0.15); border: 1px solid var(--border);
  }
  .login-box .icon { font-size: 2.5rem; margin-bottom: 12px; }
  .login-box h2 { font-size: 1.2rem; color: var(--text); margin-bottom: 6px; }
  .login-box p { color: var(--sub); font-size: 0.82rem; margin-bottom: 20px; }
  .pw-input {
    width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 12px;
    font-family: inherit; font-size: 1.4rem; text-align: center; letter-spacing: 8px;
    margin-bottom: 12px; outline: none;
  }
  .pw-input:focus { border-color: var(--primary); }
  .login-btn {
    width: 100%; padding: 14px; background: var(--primary); color: #fff;
    border: none; border-radius: 12px; font-family: inherit; font-size: 1rem;
    font-weight: 800; cursor: pointer;
  }
  .login-btn:hover { background: var(--primary-dark); }
  .pw-err { color: #d63a3a; font-size: 0.8rem; margin-top: 8px; min-height: 1em; }

  header {
    background: linear-gradient(135deg, #b8dff5, #e0f3fd);
    padding: 20px 24px; border-bottom: 1px solid var(--border);
  }
  .hdr-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 1.3rem; font-weight: 900; color: #0d3a5c; }
  header p { color: var(--primary-dark); font-size: 0.78rem; margin-top: 2px; }
  .hdr-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .hdr-btn {
    padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 10px;
    background: #fff; font-family: inherit; font-size: 0.8rem; font-weight: 700;
    color: var(--sub); cursor: pointer; transition: all 0.15s;
  }
  .hdr-btn:hover { border-color: var(--primary); color: var(--primary-dark); }
  .hdr-btn.excel { background: var(--green); border-color: var(--green); color: #fff; }
  .hdr-btn.excel:hover { background: #4a9e4a; }

  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 80px; }

  /* 날짜 필터 */
  .filter-bar {
    background: var(--card); border-radius: 14px; padding: 16px 18px;
    border: 1px solid var(--border); margin-bottom: 18px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .filter-label { font-weight: 700; font-size: 0.85rem; color: var(--sub); }
  .filter-date {
    padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 9px;
    font-family: inherit; font-size: 0.88rem; color: var(--text); outline: none;
  }
  .filter-date:focus { border-color: var(--primary); }
  .filter-btn {
    padding: 9px 16px; background: var(--primary); color: #fff; border: none;
    border-radius: 9px; font-family: inherit; font-size: 0.85rem; font-weight: 700;
    cursor: pointer;
  }

  /* 요약 */
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .s-card { background: var(--card); padding: 16px; border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); text-align: center; }
  .s-card.swim { background: linear-gradient(135deg, #e0f3fd, #cce8f7); }
  .s-card.indoor { background: linear-gradient(135deg, #fff5e8, #ffe8cc); }
  .s-card.absent { background: linear-gradient(135deg, #f5f5f5, #e8e8e8); }
  .s-card.submitted { background: linear-gradient(135deg, #e8f5e9, #d4edda); }
  .s-num { font-size: 1.8rem; font-weight: 900; color: var(--text); }
  .s-lbl { font-size: 0.75rem; color: var(--sub); margin-top: 4px; font-weight: 600; }

  /* 탭 */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; background: #fff; padding: 6px; border-radius: 12px; border: 1px solid var(--border); width: fit-content; flex-wrap: wrap; }
  .tab { padding: 9px 16px; background: transparent; border: none; border-radius: 8px; font-family: inherit; font-size: 0.82rem; font-weight: 700; color: var(--sub); cursor: pointer; transition: all 0.15s; }
  .tab.active { background: var(--primary); color: #fff; }

  .card { background: var(--card); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--border); }
  .card-title { font-size: 0.95rem; font-weight: 800; color: var(--text); margin-bottom: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  thead { background: var(--light); }
  th { padding: 10px 8px; text-align: left; font-weight: 700; color: var(--sub); font-size: 0.76rem; border-bottom: 2px solid var(--border); }
  td { padding: 10px 8px; border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: #f5fbff; }
  td.center, th.center { text-align: center; }

  .pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
  .pill.swim { background: #d0ecfa; color: #1565a0; }
  .pill.indoor { background: #ffe8cc; color: #c06000; }
  .pill.absent { background: #e8e8e8; color: #666; }
  .pill.none { background: #fff5d0; color: #c08540; }

  .class-section { margin-bottom: 20px; }
  .class-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--light); border-radius: 10px; margin-bottom: 8px; }
  .class-name { font-weight: 800; font-size: 0.9rem; color: var(--text); }
  .class-stat { font-size: 0.76rem; color: var(--sub); }
  .class-stat strong { color: var(--primary-dark); }

  /* 미제출 반 알림 */
  .pending-box {
    background: #fff8e1; border: 1px solid #ffd966; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 16px; display: none;
  }
  .pending-box.show { display: block; }
  .pending-title { font-weight: 800; color: #7a5a00; font-size: 0.88rem; margin-bottom: 6px; }
  .pending-list { font-size: 0.8rem; color: #7a5a00; }

  .empty { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 0.9rem; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 12px 22px; border-radius: 30px; font-size: 0.86rem; font-weight: 600; z-index: 9999; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    th, td { padding: 8px 5px; font-size: 0.75rem; }
    .hdr-btn { padding: 7px 10px; font-size: 0.75rem; }
    .tabs { gap: 4px; }
    .tab { padding: 8px 10px; font-size: 0.76rem; }
  }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="icon">🏊</div>
    <h2>관리자 로그인</h2>
    <p>수영참여 현황 관리자 페이지</p>
    <input type="password" class="pw-input" id="pwInput" maxlength="6" placeholder="••••" onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="login-btn" onclick="tryLogin()">확인</button>
    <div class="pw-err" id="pwErr"></div>
  </div>
</div>

<header>
  <div class="hdr-inner">
    <div>
      <h1>🏊 수영참여 현황</h1>
      <p>무지개어린이집 · 우리무지개어린이집</p>
    </div>
    <div class="hdr-actions">
      <button class="hdr-btn" onclick="loadData()">🔄 새로고침</button>
      <button class="hdr-btn excel" onclick="exportExcel()">📥 엑셀 내보내기</button>
    </div>
  </div>
</header>

<main>
  <!-- 날짜 필터 -->
  <div class="filter-bar">
    <span class="filter-label">📅 날짜</span>
    <input type="date" class="filter-date" id="filterDate">
    <button class="filter-btn" onclick="applyFilter()">조회</button>
    <button class="hdr-btn" onclick="clearFilter()">전체 보기</button>
  </div>

  <!-- 미제출 알림 -->
  <div class="pending-box" id="pendingBox">
    <div class="pending-title">⚠️ 미제출 반</div>
    <div class="pending-list" id="pendingList"></div>
  </div>

  <!-- 요약 -->
  <div class="summary-grid">
    <div class="s-card submitted"><div class="s-num" id="s-sub">-</div><div class="s-lbl">제출 반 수</div></div>
    <div class="s-card swim"><div class="s-num" id="s-swim">-</div><div class="s-lbl">🏊 수영</div></div>
    <div class="s-card indoor"><div class="s-num" id="s-indoor">-</div><div class="s-lbl">🏠 실내</div></div>
    <div class="s-card absent"><div class="s-num" id="s-absent">-</div><div class="s-lbl">❌ 결석</div></div>
  </div>

  <!-- 탭 -->
  <div class="tabs">
    <button class="tab active" id="tabA" onclick="switchTab('A')">무지개어린이집</button>
    <button class="tab" id="tabB" onclick="switchTab('B')">우리무지개어린이집</button>
    <button class="tab" id="tabAll" onclick="switchTab('all')">전체 명단</button>
  </div>

  <div id="contentArea"><div class="empty">날짜를 선택하거나 전체 데이터를 불러오세요.</div></div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDojXJ_9pOnla8uG240APwo3Ik9gBddMw4",
  authDomain: "mujigae-swimming.firebaseapp.com",
  databaseURL: "https://mujigae-swimming-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mujigae-swimming"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const PASSWORD = "7117";

// ─── 최신 명단 (2026년 5월 기준) ───────────────────────────────
const ROSTER = {
  A: {
    name: "무지개어린이집",
    groups: [
      { title: "영아반", classes: {
        "아기참새": ["박범준","정윤하","정다엘","고이솔","조은준"],
        "초롱이슬": ["전유주","양선우","박하엘","박유하","정이안","정이준"]
      }},
      { title: "유아반", classes: {
        "은빛물결": ["이재헌","박수현","김성원","정하준","송지우","박승빈","김정후","주현우","신승혁","김수호","정연우","최보민","한다윤"]
      }},
      { title: "방과후반", classes: {
        "드림": ["정하율","권민재","심유혁","안하람","박준하","서준우","강건영","박상현","구가율","김도원"]
      }}
    ]
  },
  B: {
    name: "우리무지개어린이집",
    groups: [
      { title: "유아반", classes: {
        "아침햇살": ["정태호","고은호","김이안","전수호","위단우","서현우","김윤우","김지안"],
        "들꽃향기": ["한지후","박은진","곽시안","박찬율","설재은","류시환","강은호","박다엘","김사랑","손리완","이로아","이소민","방서윤","김인우","이은우","임서우","이하린"],
        "고운햇살": ["박재희","박지유","김민준","곽나율","김은서","홍하루","김동휘","임라희"],
        "푸른하늘": ["김아린","김강준","박진우","한서후","윤태언","김서우","백민지","이하민","강태희","곽다온","박준","김세윤","김지민","이채민"],
        "파도소리": ["윤지아","김수겸","돌란샤나","권민서","최도윤","장시영"],
        "푸른바다": ["김평온","김별리","양준우","강지호","김도우","백이엘","이태헌","오주원","서연석","임하라","김태유","조믿음","유이서","윤예나","윤예지","조가온","곽시후","이소민"]
      }},
      { title: "방과후반", classes: {
        "다짐": ["김중원","이아윤","강남준","문시후","문휘경","이안","이하준"],
        "모둠": ["김가온","한시혁","강승아","이승호","박도윤","최미소","정서진","김리윤","박수현","송아린","박건우","조하준","조혜윤"]
      }}
    ]
  }
};

// 전체 반 목록 (평탄화)
function getAllClasses() {
  const list = [];
  ['A','B'].forEach(k => {
    ROSTER[k].groups.forEach(g => {
      Object.entries(g.classes).forEach(([cls, children]) => {
        list.push({ inst: k, instName: ROSTER[k].name, group: g.title, cls, children });
      });
    });
  });
  return list;
}

let allData = {};
let currentTab = 'A';
let currentDate = '';

// ─── 로그인 ────────────────────────────────────────────────────
window.tryLogin = function() {
  if (document.getElementById('pwInput').value === PASSWORD) {
    document.getElementById('loginOverlay').style.display = 'none';
    loadData();
  } else {
    document.getElementById('pwErr').textContent = '비밀번호가 일치하지 않습니다';
    document.getElementById('pwInput').value = '';
  }
};

// ─── 데이터 로드 ───────────────────────────────────────────────
window.loadData = async function() {
  try {
    const snap = await get(ref(db, 'swimming_survey'));
    allData = snap.exists() ? snap.val() : {};
    updateSummary();
    renderCurrentTab();
    toast('데이터를 불러왔어요');
  } catch(e) { toast('불러오기 실패'); }
};

// ─── 날짜 필터 ─────────────────────────────────────────────────
window.applyFilter = function() {
  currentDate = document.getElementById('filterDate').value;
  if (!currentDate) { toast('날짜를 선택해 주세요'); return; }
  updateSummary();
  renderCurrentTab();
  checkPending();
};

window.clearFilter = function() {
  currentDate = '';
  document.getElementById('filterDate').value = '';
  document.getElementById('pendingBox').classList.remove('show');
  updateSummary();
  renderCurrentTab();
};

function getFilteredData() {
  if (!currentDate) return allData;
  const filtered = {};
  Object.entries(allData).forEach(([k, v]) => {
    if (k.startsWith(currentDate + '_')) filtered[k] = v;
  });
  return filtered;
}

function getDataForClass(cls, date) {
  const key = date ? `${date}_${cls}` : null;
  if (key) return allData[key] || null;
  // 날짜 없으면 최근 것
  const keys = Object.keys(allData).filter(k => k.endsWith('_' + cls)).sort().reverse();
  return keys.length ? allData[keys[0]] : null;
}

// ─── 요약 ──────────────────────────────────────────────────────
function updateSummary() {
  const data = getFilteredData();
  let swim = 0, indoor = 0, absent = 0, submitted = 0;
  Object.values(data).forEach(d => {
    if (!d.children) return;
    submitted++;
    Object.values(d.children).forEach(s => {
      if (s === 'swim') swim++;
      else if (s === 'indoor') indoor++;
      else if (s === 'absent') absent++;
    });
  });
  document.getElementById('s-sub').textContent = submitted;
  document.getElementById('s-swim').textContent = swim;
  document.getElementById('s-indoor').textContent = indoor;
  document.getElementById('s-absent').textContent = absent;
}

// 미제출 반 확인
function checkPending() {
  if (!currentDate) { document.getElementById('pendingBox').classList.remove('show'); return; }
  const all = getAllClasses();
  const pending = all.filter(c => !allData[`${currentDate}_${c.cls}`]);
  const box = document.getElementById('pendingBox');
  if (pending.length === 0) { box.classList.remove('show'); return; }
  box.classList.add('show');
  document.getElementById('pendingList').textContent = pending.map(c => `${c.instName} ${c.cls}`).join(' · ');
}

// ─── 탭 ────────────────────────────────────────────────────────
window.switchTab = function(t) {
  currentTab = t;
  ['A','B','all'].forEach(id => document.getElementById('tab'+id).classList.toggle('active', id === t));
  renderCurrentTab();
};

function renderCurrentTab() {
  if (currentTab === 'all') renderAllList();
  else renderByClass(currentTab);
}

function statusPill(s) {
  if (s === 'swim') return '<span class="pill swim">🏊 수영</span>';
  if (s === 'indoor') return '<span class="pill indoor">🏠 실내</span>';
  if (s === 'absent') return '<span class="pill absent">❌ 결석</span>';
  return '<span class="pill none">미입력</span>';
}

// ─── 반별 렌더링 ───────────────────────────────────────────────
function renderByClass(instKey) {
  const inst = ROSTER[instKey];
  let html = '';

  inst.groups.forEach(g => {
    Object.entries(g.classes).forEach(([cls, children]) => {
      const d = currentDate ? allData[`${currentDate}_${cls}`] : null;
      const submitted = !!(d && d.children);
      const swimCnt = submitted ? Object.values(d.children).filter(v=>v==='swim').length : 0;
      const indoorCnt = submitted ? Object.values(d.children).filter(v=>v==='indoor').length : 0;
      const absentCnt = submitted ? Object.values(d.children).filter(v=>v==='absent').length : 0;
      const dateLabel = d ? d.date : (currentDate || '-');

      html += `
        <div class="class-section">
          <div class="class-header">
            <div class="class-name">${cls} <span style="color:var(--muted);font-weight:500;font-size:0.76rem;">(${g.title})</span></div>
            <div class="class-stat">${submitted
              ? `🏊 <strong>${swimCnt}</strong> · 🏠 <strong>${indoorCnt}</strong> · ❌ <strong>${absentCnt}</strong>`
              : '<span style="color:#c08540;">⚠️ 미제출</span>'}</div>
          </div>
          <div class="card" style="padding:0;overflow:auto;">
            <table>
              <thead><tr>
                <th>아동</th>
                <th class="center">참여 여부</th>
                ${!currentDate ? '<th>날짜</th>' : ''}
              </tr></thead>
              <tbody>`;

      children.forEach(child => {
        let status = '', dateStr = '';
        if (submitted && d.children[child]) {
          status = d.children[child];
          dateStr = d.date || '-';
        } else if (!currentDate) {
          // 날짜 미선택 시 최근 데이터 탐색
          const keys = Object.keys(allData).filter(k => k.endsWith('_'+cls)).sort().reverse();
          if (keys.length && allData[keys[0]].children) {
            status = allData[keys[0]].children[child] || '';
            dateStr = allData[keys[0]].date || '-';
          }
        }
        html += `<tr>
          <td><strong>${child}</strong></td>
          <td class="center">${statusPill(status)}</td>
          ${!currentDate ? `<td style="color:var(--muted);font-size:0.78rem;">${dateStr}</td>` : ''}
        </tr>`;
      });

      html += `</tbody></table></div></div>`;
    });
  });

  document.getElementById('contentArea').innerHTML = html;
}

// ─── 전체 명단 ─────────────────────────────────────────────────
function renderAllList() {
  const swim = [], indoor = [], absent = [];

  getAllClasses().forEach(({ inst, instName, cls, children }) => {
    const d = currentDate ? allData[`${currentDate}_${cls}`] : null;
    if (!d || !d.children) return;
    children.forEach(child => {
      const s = d.children[child];
      const row = { instName, cls, child, date: d.date };
      if (s === 'swim') swim.push(row);
      else if (s === 'indoor') indoor.push(row);
      else if (s === 'absent') absent.push(row);
    });
  });

  const tbl = (list, emptyMsg) => list.length === 0
    ? `<tr><td colspan="4" class="center" style="color:var(--muted);padding:20px;">${emptyMsg}</td></tr>`
    : list.map(r => `<tr><td>${r.instName}</td><td>${r.cls}</td><td><strong>${r.child}</strong></td><td style="color:var(--muted);font-size:0.78rem;">${r.date||'-'}</td></tr>`).join('');

  document.getElementById('contentArea').innerHTML = `
    <div class="card">
      <div class="card-title">🏊 수영 참여 (${swim.length}명)</div>
      <div style="overflow:auto;"><table>
        <thead><tr><th>어린이집</th><th>반</th><th>아동</th><th>날짜</th></tr></thead>
        <tbody>${tbl(swim, '수영 참여자 없음')}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-title">🏠 실내 참여 (${indoor.length}명)</div>
      <div style="overflow:auto;"><table>
        <thead><tr><th>어린이집</th><th>반</th><th>아동</th><th>날짜</th></tr></thead>
        <tbody>${tbl(indoor, '실내 참여자 없음')}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-title">❌ 결석 (${absent.length}명)</div>
      <div style="overflow:auto;"><table>
        <thead><tr><th>어린이집</th><th>반</th><th>아동</th><th>날짜</th></tr></thead>
        <tbody>${tbl(absent, '결석자 없음')}</tbody>
      </table></div>
    </div>`;
}

// ─── 엑셀 내보내기 ─────────────────────────────────────────────
window.exportExcel = function() {
  const wb = XLSX.utils.book_new();

  // 시트1: 전체 응답
  const all = [['어린이집','반','아동','참여여부','날짜','제출시각']];
  getAllClasses().forEach(({ instName, cls, children }) => {
    const d = currentDate ? allData[`${currentDate}_${cls}`] : null;
    if (!d || !d.children) {
      children.forEach(c => all.push([instName, cls, c, '미제출', currentDate||'', '']));
    } else {
      children.forEach(c => {
        const s = d.children[c] || '미입력';
        const label = s==='swim'?'수영': s==='indoor'?'실내': s==='absent'?'결석': s;
        all.push([instName, cls, c, label, d.date||'', d.submittedAt ? new Date(d.submittedAt).toLocaleString('ko-KR') : '']);
      });
    }
  });
  const ws1 = XLSX.utils.aoa_to_sheet(all);
  ws1['!cols'] = [{wch:18},{wch:10},{wch:10},{wch:8},{wch:12},{wch:18}];
  XLSX.utils.book_append_sheet(wb, ws1, '전체 명단');

  // 시트2: 수영
  const swimData = [['어린이집','반','아동','날짜']];
  // 시트3: 실내
  const indoorData = [['어린이집','반','아동','날짜']];
  // 시트4: 결석
  const absentData = [['어린이집','반','아동','날짜']];

  getAllClasses().forEach(({ instName, cls, children }) => {
    const d = currentDate ? allData[`${currentDate}_${cls}`] : null;
    if (!d || !d.children) return;
    children.forEach(c => {
      const s = d.children[c];
      const row = [instName, cls, c, d.date||''];
      if (s === 'swim') swimData.push(row);
      else if (s === 'indoor') indoorData.push(row);
      else if (s === 'absent') absentData.push(row);
    });
  });

  [['수영 명단', swimData],['실내 명단', indoorData],['결석 명단', absentData]].forEach(([name, data]) => {
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{wch:18},{wch:10},{wch:10},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws, name);
  });

  const dateStr = currentDate || new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `수영참여현황_${dateStr}.xlsx`);
  toast('엑셀 파일이 다운로드되었어요');
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
window.toast = toast;

document.getElementById('pwInput').focus();
</script>
