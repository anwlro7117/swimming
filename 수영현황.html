<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏊 수영참여 현황</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f0f8ff;--card:#fff;--border:#d0e8f8;--pri:#3a9bd5;--dark:#2178b0;--light:#e8f5fd;--text:#1a3a4a;--sub:#4a7a96;--muted:#8aafc4;--swim:#3a9bd5;--indoor:#f4a85a;--absent:#9e9e9e;--green:#5cb85c;--red:#e05050;--sh:0 4px 16px rgba(58,155,213,.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
#loginWrap{position:fixed;inset:0;background:rgba(224,243,253,.97);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(8px);}
.lbox{background:#fff;padding:34px 28px;border-radius:20px;max-width:310px;width:calc(100% - 32px);text-align:center;box-shadow:0 20px 60px rgba(58,155,213,.15);border:1px solid var(--border);}
.lbox .ic{font-size:2.4rem;margin-bottom:11px;}
.lbox h2{font-size:1.15rem;color:var(--text);margin-bottom:5px;}
.lbox p{color:var(--sub);font-size:.8rem;margin-bottom:18px;}
.pwinput{width:100%;padding:13px;border:2px solid var(--border);border-radius:11px;font-family:inherit;font-size:1.4rem;text-align:center;letter-spacing:8px;margin-bottom:11px;outline:none;}
.pwinput:focus{border-color:var(--pri);}
.loginbtn{width:100%;padding:13px;background:var(--pri);color:#fff;border:none;border-radius:11px;font-family:inherit;font-size:.95rem;font-weight:800;cursor:pointer;}
.loginbtn:hover{background:var(--dark);}
.pwerr{color:#d63a3a;font-size:.78rem;margin-top:7px;min-height:1em;}
header{background:linear-gradient(135deg,#b8dff5,#e0f3fd);padding:18px 20px;border-bottom:1px solid var(--border);}
.hi{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header h1{font-size:1.25rem;font-weight:900;color:#0d3a5c;}
header p{color:var(--dark);font-size:.76rem;margin-top:2px;}
.hbtns{display:flex;gap:7px;flex-wrap:wrap;}
.hbtn{padding:8px 13px;border:1.5px solid var(--border);border-radius:9px;background:#fff;font-family:inherit;font-size:.78rem;font-weight:700;color:var(--sub);cursor:pointer;transition:all .13s;}
.hbtn:hover{border-color:var(--pri);color:var(--dark);}
.hbtn.excel{background:var(--green);border-color:var(--green);color:#fff;}
.hbtn.excel:hover{background:#4a9e4a;}
.hbtn.reset{background:var(--red);border-color:var(--red);color:#fff;}
.hbtn.reset:hover{background:#c03030;}
main{max-width:1100px;margin:0 auto;padding:18px 14px 80px;}
.today-bar{background:var(--card);border-radius:13px;padding:12px 16px;border:1px solid var(--border);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.today-lbl{font-size:.88rem;font-weight:800;color:var(--text);}
.today-date{font-size:.82rem;color:var(--sub);}
.mtabs{display:flex;margin-bottom:16px;background:#fff;border-radius:13px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--sh);}
.mtab{flex:1;padding:14px 8px;border:none;font-family:inherit;font-size:.86rem;font-weight:800;cursor:pointer;background:#fff;color:var(--sub);transition:all .13s;}
.mtab.on{background:var(--pri);color:#fff;}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px;}
.sc{background:var(--card);padding:14px;border-radius:13px;border:1px solid var(--border);box-shadow:var(--sh);text-align:center;}
.sc.sw{background:linear-gradient(135deg,#e0f3fd,#cce8f7);}
.sc.id{background:linear-gradient(135deg,#fff5e8,#ffe8cc);}
.sc.ab{background:linear-gradient(135deg,#f5f5f5,#e8e8e8);}
.sc.sb{background:linear-gradient(135deg,#e8f5e9,#d4edda);}
.sc.at{background:linear-gradient(135deg,#e8f5e9,#d4edda);}
.sc.of{background:linear-gradient(135deg,#fde8ef,#fad0df);}
.sc.lv{background:linear-gradient(135deg,#fff5e8,#ffe8cc);}
.sc.no{background:linear-gradient(135deg,#f5f5f5,#e8e8e8);}
.snum{font-size:1.7rem;font-weight:900;color:var(--text);}
.slbl{font-size:.7rem;color:var(--sub);margin-top:3px;font-weight:600;}
.tabs{display:flex;gap:7px;margin-bottom:14px;background:#fff;padding:5px;border-radius:11px;border:1px solid var(--border);width:fit-content;flex-wrap:wrap;}
.tab{padding:8px 14px;background:transparent;border:none;border-radius:7px;font-family:inherit;font-size:.8rem;font-weight:700;color:var(--sub);cursor:pointer;transition:all .13s;}
.tab.on{background:var(--pri);color:#fff;}
.card{background:var(--card);border-radius:13px;padding:16px;box-shadow:var(--sh);margin-bottom:13px;border:1px solid var(--border);}
.ctitle{font-size:.92rem;font-weight:800;color:var(--text);margin-bottom:11px;}
table{width:100%;border-collapse:collapse;font-size:.81rem;}
thead{background:var(--light);}
th{padding:9px 7px;text-align:left;font-weight:700;color:var(--sub);font-size:.74rem;border-bottom:2px solid var(--border);}
td{padding:9px 7px;border-bottom:1px solid var(--border);}
tbody tr:hover{background:#f5fbff;}
td.c,th.c{text-align:center;}
.pill{display:inline-block;padding:3px 9px;border-radius:18px;font-size:.7rem;font-weight:700;}
.pill.sw{background:#d0ecfa;color:#1565a0;}
.pill.id{background:#ffe8cc;color:#c06000;}
.pill.ab{background:#e8e8e8;color:#666;}
.pill.no{background:#fff5d0;color:#c08540;}
.pill.at{background:#d4edda;color:#1a6630;}
.pill.of{background:#fde8ef;color:#a01050;}
.pill.lv-am{background:#fff0cc;color:#c06000;}
.pill.lv-pm{background:#ffe0cc;color:#c04000;}
.pill.lv-all{background:#ffd0b0;color:#a03000;}
.pill.lv-none{background:#fff5d0;color:#c08540;}
.csect{margin-bottom:18px;}
.chdr{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;background:var(--light);border-radius:9px;margin-bottom:7px;}
.cname{font-weight:800;font-size:.88rem;color:var(--text);}
.cstat{font-size:.74rem;color:var(--sub);}
.cstat strong{color:var(--dark);}
.empty{text-align:center;padding:48px 18px;color:var(--muted);font-size:.88rem;}
/* 리셋 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9998;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:18px;padding:28px 24px;max-width:360px;width:calc(100% - 32px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal h3{font-size:1.05rem;font-weight:900;color:var(--text);margin-bottom:8px;}
.modal p{font-size:.82rem;color:var(--sub);margin-bottom:18px;line-height:1.6;}
.modal-btns{display:flex;gap:8px;}
.mbtn{flex:1;padding:13px;border:none;border-radius:10px;font-family:inherit;font-size:.88rem;font-weight:800;cursor:pointer;}
.mbtn.cancel{background:var(--light);color:var(--sub);}
.mbtn.confirm{background:var(--red);color:#fff;}
.reset-list{text-align:left;margin-bottom:16px;}
.reset-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
.reset-item:last-child{border-bottom:none;}
.reset-item label{font-size:.84rem;color:var(--text);cursor:pointer;flex:1;}
.reset-item input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--red);}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:26px;font-size:.82rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
@media(max-width:600px){.sgrid{grid-template-columns:repeat(2,1fr);}th,td{padding:7px 4px;font-size:.72rem;}.hbtn{padding:6px 9px;font-size:.72rem;}.tabs{gap:3px;}.tab{padding:7px 9px;font-size:.74rem;}.mtab{font-size:.8rem;padding:12px 5px;}}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginWrap">
  <div class="lbox">
    <div class="ic">🏊</div>
    <h2>관리자 로그인</h2>
    <p>수영참여 현황 관리자 페이지</p>
    <input type="password" class="pwinput" id="pwInput" maxlength="6" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="loginbtn" onclick="doLogin()">확인</button>
    <div class="pwerr" id="pwErr"></div>
  </div>
</div>

<!-- 리셋 모달 -->
<div class="modal-bg" id="resetModal">
  <div class="modal">
    <h3>🗑️ 데이터 초기화</h3>
    <p>삭제할 항목을 선택하세요.<br>삭제된 데이터는 복구할 수 없어요.</p>
    <div class="reset-list" id="resetList"></div>
    <div class="modal-btns">
      <button class="mbtn cancel" onclick="closeReset()">취소</button>
      <button class="mbtn confirm" onclick="doReset()">삭제하기</button>
    </div>
  </div>
</div>

<header>
  <div class="hi">
    <div><h1>🏊 수영참여 현황</h1><p>무지개어린이집 · 우리무지개어린이집</p></div>
    <div class="hbtns">
      <button class="hbtn" onclick="loadData()">🔄 새로고침</button>
      <button class="hbtn reset" onclick="openReset()">🗑️ 데이터 초기화</button>
      <button class="hbtn excel" onclick="doExcel()">📥 엑셀 내보내기</button>
    </div>
  </div>
</header>

<main>
  <!-- 오늘 날짜 표시 -->
  <div class="today-bar">
    <div class="today-lbl">📊 전체 합산 데이터</div>
    <div class="today-date" id="todayDisp"></div>
  </div>

  <!-- 디버그 패널 -->
  <div id="debugInfo" style="display:none;background:#1a3a4a;color:#7ff;padding:10px 14px;border-radius:10px;font-size:.75rem;font-family:monospace;margin-bottom:12px;word-break:break-all;"></div>

  <!-- 메인탭 -->
  <div class="mtabs">
    <button class="mtab on" id="mTabC" onclick="showMain('child')">🧒 아동 현황</button>
    <button class="mtab"    id="mTabT" onclick="showMain('teacher')">👩‍🏫 교사 현황</button>
  </div>

  <!-- 아동 섹션 -->
  <div id="secChild">
    <div class="sgrid">
      <div class="sc sb"><div class="snum" id="s_sub">-</div><div class="slbl">입력 반 수</div></div>
      <div class="sc sw"><div class="snum" id="s_sw">-</div><div class="slbl">🏊 수영</div></div>
      <div class="sc id"><div class="snum" id="s_id">-</div><div class="slbl">🏠 원내보육</div></div>
      <div class="sc ab"><div class="snum" id="s_ab">-</div><div class="slbl">❌ 결석</div></div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tabA"   onclick="switchTab('A')">무지개어린이집</button>
      <button class="tab"    id="tabB"   onclick="switchTab('B')">우리무지개어린이집</button>
      <button class="tab"    id="tabAll" onclick="switchTab('all')">전체 명단</button>
    </div>
    <div id="contentArea"><div class="empty">데이터를 불러오는 중...</div></div>
  </div>

  <!-- 교사 섹션 -->
  <div id="secTeacher" style="display:none;">
    <div class="sgrid">
      <div class="sc at"><div class="snum" id="ts_at">-</div><div class="slbl">✅ 참여</div></div>
      <div class="sc of"><div class="snum" id="ts_of">-</div><div class="slbl">❌ 불참</div></div>
      <div class="sc lv"><div class="snum" id="ts_lv">-</div><div class="slbl">🏖️ 당일휴가</div></div>
      <div class="sc no"><div class="snum" id="ts_no">-</div><div class="slbl">⬜ 미입력</div></div>
    </div>
    <div id="tContentArea"><div class="empty">데이터를 불러오는 중...</div></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const fbApp = initializeApp({
  apiKey:"AIzaSyDojXJ_9pOnla8uG240APwo3Ik9gBddMw4",
  authDomain:"mujigae-swimming.firebaseapp.com",
  databaseURL:"https://mujigae-swimming-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"mujigae-swimming"
});
const db = getDatabase(fbApp);
const PW = "7117";

const ROSTER = {
  A:{name:"무지개어린이집",groups:[
    {title:"영아반",classes:{
      "아기참새":["박범준","정윤하","정다엘","고이솔","조은준"],
      "초롱이슬":["전유주","양선우","박하엘","박유하","정이안","정이준"]
    }},
    {title:"유아반",classes:{
      "은빛물결":["이재헌","박수현","김성원","정하준","송지우","박승빈","김정후","주현우","신승혁","김수호","정연우","최보민","한다윤"]
    }}
  ]},
  B:{name:"우리무지개어린이집",groups:[
    {title:"유아반",classes:{
      "아침햇살":["정태호","고은호","김이안","전수호","위단우","서현우","김윤우","김지안"],
      "들꽃향기":["한지후","박은진","곽시안","박찬율","설재은","류시환","강은호","박다엘","김사랑","손리완","이로아","이소민","방서윤","김인우","이은우","임서우","이하린"],
      "고운햇살":["박재희","박지유","김민준","곽나율","김은서","홍하루","김동휘","임라희"],
      "푸른하늘":["김아린","김강준","박진우","한서후","윤태언","김서우","백민지","이하민","강태희","곽다온","박준","김세윤","김지민","이채민"],
      "파도소리":["윤지아","김수겸","돌란샤나","권민서","최도윤","장시영"],
      "푸른바다":["김평온","김별리","양준우","강지호","김도우","백이엘","이태헌","오주원","서연석","임하라","김태유","조믿음","유이서","윤예나","윤예지","조가온","곽시후","이소민"]
    }}
  ]}
};

const TGROUPS=[
  {title:"무지개어린이집",list:[
    {n:"우지선",r:"아기참새"},{n:"정선윤",r:"초롱이슬"},
    {n:"채준범",r:"은빛물결"},{n:"이왕성",r:"은빛물결"},{n:"서명화",r:"은빛물결"},{n:"임민주",r:"은빛물결"},
    {n:"황경하",r:"드림(방과후)"},{n:"이승원",r:"드림(방과후)"},{n:"박정민",r:"드림(방과후)"},
    {n:"주은아",r:"연장반"},{n:"윤혜정",r:"연장반"},
    {n:"강수민",r:"치료사"},{n:"서홍련",r:"치료사"},{n:"정소윤",r:"치료사"}
  ]},
  {title:"우리무지개어린이집",list:[
    {n:"강수지",r:"아침햇살"},{n:"김보라",r:"아침햇살"},{n:"김하민",r:"아침햇살"},
    {n:"박서정",r:"고운햇살"},{n:"천은주",r:"고운햇살"},{n:"모정아",r:"고운햇살"},
    {n:"박초롱",r:"들꽃향기"},{n:"이효선",r:"들꽃향기"},
    {n:"조현아",r:"푸른하늘"},{n:"황선하",r:"푸른하늘"},
    {n:"임정연",r:"파도소리"},{n:"조명원",r:"파도소리"},
    {n:"백장미",r:"푸른바다"},{n:"이슬아",r:"푸른바다"},{n:"유주환",r:"푸른바다"},
    {n:"송태헌",r:"다짐(방과후)"},{n:"마호진",r:"다짐(방과후)"},
    {n:"정인애",r:"모둠(방과후)"},{n:"변아진",r:"모둠(방과후)"},{n:"윤아름",r:"모둠(방과후)"},{n:"정다송",r:"모둠(방과후)"},
    {n:"이미화",r:"치료사"},{n:"권다애",r:"치료사"},{n:"표영민",r:"치료사"},
    {n:"전나인",r:"치료사"},{n:"박규리",r:"치료사"},{n:"임주현",r:"치료사"}
  ]}
];
const ALL_T = TGROUPS.flatMap(g=>g.list);

function getAllClasses(){
  const list=[];
  ['A','B'].forEach(k=>{
    ROSTER[k].groups.forEach(g=>{
      Object.entries(g.classes).forEach(([cls,children])=>{
        list.push({inst:k,instName:ROSTER[k].name,group:g.title,cls,children});
      });
    });
  });
  return list;
}

let allData={};
let curTab='A';

const $=id=>document.getElementById(id);
const toast=msg=>{const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);};

// 오늘 날짜 표시
$('todayDisp').textContent='조회: '+new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});

// ── 로그인 ───────────────────────────────────────────────
window.doLogin = function(){
  if($('pwInput').value===PW){
    $('loginWrap').style.display='none';
    loadData();
  } else {
    $('pwErr').textContent='비밀번호가 일치하지 않습니다';
    $('pwInput').value='';
  }
};

// ── 데이터 로드 (오늘 날짜 고정) ────────────────────────
window.loadData = async function(){
  try {
    const snap = await get(ref(db,'swimming_survey'));
    allData = snap.exists() ? snap.val() : {};
    // 디버그: 받아온 키 목록 표시
    const keys = Object.keys(allData);
    $('debugInfo').textContent = '수신 키: ' + (keys.length ? keys.join(', ') : '없음');
    $('debugInfo').style.display = 'block';
    updateSummary(); renderCurrent();
    if($('secTeacher').style.display!=='none') renderTeacherSection();
    $('todayDisp').textContent='조회: '+new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});
    toast('데이터를 불러왔어요');
  } catch(e){ toast('불러오기 실패: '+e.message); }
};

// ── 요약 ─────────────────────────────────────────────────
function updateSummary(){
  let sw=0,id=0,ab=0,sub=0;
  getAllClasses().forEach(({cls})=>{
    const d=allData[`${cls}`];
    if(!d||!d.children)return; sub++;
    Object.values(d.children).forEach(s=>{if(s==='swim')sw++;else if(s==='indoor')id++;else if(s==='absent')ab++;});
  });
  $('s_sub').textContent=sub; $('s_sw').textContent=sw;
  $('s_id').textContent=id;   $('s_ab').textContent=ab;
}

// ── 메인탭 ───────────────────────────────────────────────
window.showMain = function(sec){
  $('mTabC').classList.toggle('on',sec==='child');
  $('mTabT').classList.toggle('on',sec==='teacher');
  $('secChild').style.display   = sec==='child'   ?'block':'none';
  $('secTeacher').style.display = sec==='teacher' ?'block':'none';
  if(sec==='teacher') renderTeacherSection();
};

// ── 아동탭 ───────────────────────────────────────────────
window.switchTab = function(t){
  curTab=t;
  ['A','B','all'].forEach(id=>$('tab'+id).classList.toggle('on',id===t));
  renderCurrent();
};

function renderCurrent(){
  if(curTab==='all') renderAllList();
  else renderByClass(curTab);
}

function pill(s){
  if(s==='swim')   return '<span class="pill sw">🏊 수영</span>';
  if(s==='indoor') return '<span class="pill id">🏠 원내보육</span>';
  if(s==='absent') return '<span class="pill ab">❌ 결석</span>';
  return '<span class="pill no">미입력</span>';
}

function renderByClass(ik){
  let html='';
  ROSTER[ik].groups.forEach(g=>{
    Object.entries(g.classes).forEach(([cls,children])=>{
      const d=allData[`${cls}`];
      const ok=!!(d&&d.children);
      const sw=ok?Object.values(d.children).filter(v=>v==='swim').length:0;
      const id=ok?Object.values(d.children).filter(v=>v==='indoor').length:0;
      const ab=ok?Object.values(d.children).filter(v=>v==='absent').length:0;
      html+=`<div class="csect">
        <div class="chdr">
          <div class="cname">${cls} <span style="color:var(--muted);font-weight:500;font-size:.74rem;">(${g.title})</span></div>
          <div class="cstat">${ok
            ?`🏊 <strong>${sw}</strong> · 🏠 <strong>${id}</strong> · ❌ <strong>${ab}</strong>`
            :'<span style="color:#c08540;">⚠️ 미입력</span>'}</div>
        </div>
        <div class="card" style="padding:0;overflow:auto;"><table>
          <thead><tr><th>아동</th><th class="c">참여여부</th></tr></thead><tbody>`;
      children.forEach(ch=>{
        const st=ok&&d.children[ch]?d.children[ch]:'';
        html+=`<tr><td><strong>${ch}</strong></td><td class="c">${pill(st)}</td></tr>`;
      });
      html+=`</tbody></table></div></div>`;
    });
  });
  $('contentArea').innerHTML=html||'<div class="empty">데이터가 없어요.</div>';
}

function renderAllList(){
  const sw=[],id=[],ab=[];
  getAllClasses().forEach(({instName,cls,children})=>{
    const d=allData[`${cls}`];
    if(!d||!d.children)return;
    children.forEach(ch=>{
      const s=d.children[ch];
      const row={instName,cls,child:ch};
      if(s==='swim')sw.push(row);else if(s==='indoor')id.push(row);else if(s==='absent')ab.push(row);
    });
  });
  const tbl=(list,empty)=>list.length===0
    ?`<tr><td colspan="3" class="c" style="color:var(--muted);padding:18px;">${empty}</td></tr>`
    :list.map(r=>`<tr><td>${r.instName}</td><td>${r.cls}</td><td><strong>${r.child}</strong></td></tr>`).join('');
  $('contentArea').innerHTML=`
    <div class="card"><div class="ctitle">🏊 수영 (${sw.length}명)</div><div style="overflow:auto;"><table><thead><tr><th>어린이집</th><th>반</th><th>아동</th></tr></thead><tbody>${tbl(sw,'수영 참여자 없음')}</tbody></table></div></div>
    <div class="card"><div class="ctitle">🏠 원내보육 (${id.length}명)</div><div style="overflow:auto;"><table><thead><tr><th>어린이집</th><th>반</th><th>아동</th></tr></thead><tbody>${tbl(id,'원내보육 없음')}</tbody></table></div></div>
    <div class="card"><div class="ctitle">❌ 결석 (${ab.length}명)</div><div style="overflow:auto;"><table><thead><tr><th>어린이집</th><th>반</th><th>아동</th></tr></thead><tbody>${tbl(ab,'결석자 없음')}</tbody></table></div></div>`;
}

// ── 교사 현황 ────────────────────────────────────────────
function tpill(st){
  if(!st||!st.s) return '<span class="pill no">미입력</span>';
  if(st.s==='attend') return '<span class="pill at">✅ 참여</span>';
  if(st.s==='off')    return '<span class="pill of">❌ 불참</span>';
  if(st.s==='leave'){
    const m=st.lt==='am'?'🌅 오전반차':st.lt==='pm'?'🌇 오후반차':st.lt==='all'?'☀️ 종일휴가':'미선택';
    const c=st.lt==='am'?'lv-am':st.lt==='pm'?'lv-pm':st.lt==='all'?'lv-all':'lv-none';
    return `<span class="pill ${c}">🏖️ ${m}</span>`;
  }
  return '<span class="pill no">미입력</span>';
}

function renderTeacherSection(){
  const td=allData[`teachers`];
  const teachers=td?td.teachers||{}:{};
  let att=0,off=0,lv=0,none=0;
  ALL_T.forEach(t=>{
    const s=teachers[t.n];
    if(!s||!s.s)none++;
    else if(s.s==='attend')att++;
    else if(s.s==='off')off++;
    else if(s.s==='leave')lv++;
  });
  $('ts_at').textContent=att; $('ts_of').textContent=off;
  $('ts_lv').textContent=lv;  $('ts_no').textContent=none;
  let html='';
  TGROUPS.forEach(g=>{
    const gA=g.list.filter(t=>teachers[t.n]?.s==='attend').length;
    const gO=g.list.filter(t=>teachers[t.n]?.s==='off').length;
    const gL=g.list.filter(t=>teachers[t.n]?.s==='leave').length;
    html+=`<div class="csect">
      <div class="chdr">
        <div class="cname">${g.title}</div>
        <div class="cstat">✅ <strong>${gA}</strong> · ❌ <strong>${gO}</strong> · 🏖️ <strong>${gL}</strong></div>
      </div>
      <div class="card" style="padding:0;overflow:auto;"><table>
        <thead><tr><th>이름</th><th>담당</th><th class="c">참여여부</th></tr></thead><tbody>`;
    g.list.forEach(t=>{
      const st=teachers[t.n];
      html+=`<tr><td><strong>${t.n}</strong></td><td style="color:var(--muted);font-size:.76rem;">${t.r}</td><td class="c">${tpill(st)}</td></tr>`;
    });
    html+=`</tbody></table></div></div>`;
  });
  $('tContentArea').innerHTML=html||'<div class="empty">입력된 교사 데이터가 없어요.</div>';
}

// ── 데이터 리셋 ──────────────────────────────────────────
window.openReset = function(){
  // 오늘 데이터 있는 항목만 체크박스로 표시
  const items=[];
  // 아동
  getAllClasses().forEach(({instName,cls})=>{
    const key=`${cls}`;
    if(allData[key]) items.push({key, label:`🧒 ${instName} · ${cls}`});
  });
  // 교사
  const tKey=`teachers`;
  if(allData[tKey]) items.push({key:tKey, label:`👩‍🏫 교사 전체`});

  if(!items.length){toast('오늘 입력된 데이터가 없어요.');return;}

  $('resetList').innerHTML=items.map(item=>`
    <div class="reset-item">
      <input type="checkbox" id="rc_${item.key}" value="${item.key}" checked>
      <label for="rc_${item.key}">${item.label}</label>
    </div>`).join('');
  $('resetModal').classList.add('show');
};

window.closeReset = function(){
  $('resetModal').classList.remove('show');
};

window.doReset = async function(){
  const checked=[...document.querySelectorAll('#resetList input:checked')].map(el=>el.value);
  if(!checked.length){toast('삭제할 항목을 선택해 주세요.');return;}
  try {
    await Promise.all(checked.map(key=>remove(ref(db,`swimming_survey/${key}`))));
    checked.forEach(key=>delete allData[key]);
    $('resetModal').classList.remove('show');
    updateSummary(); renderCurrent();
    if($('secTeacher').style.display!=='none') renderTeacherSection();
    toast(`${checked.length}개 항목을 삭제했어요.`);
  } catch(e){ toast('삭제 실패: '+e.message); }
};

// ── 엑셀 ─────────────────────────────────────────────────
window.doExcel = function(){
  const wb=XLSX.utils.book_new();
  const all=[['어린이집','반','아동','참여여부']];
  const swD=[['어린이집','반','아동']],idD=[['어린이집','반','아동']],abD=[['어린이집','반','아동']];
  getAllClasses().forEach(({instName,cls,children})=>{
    const d=allData[`${cls}`];
    if(!d||!d.children){children.forEach(c=>all.push([instName,cls,c,'미입력']));return;}
    children.forEach(c=>{
      const s=d.children[c]||'미입력';
      const lbl=s==='swim'?'수영':s==='indoor'?'원내보육':s==='absent'?'결석':s;
      all.push([instName,cls,c,lbl]);
      const row=[instName,cls,c];
      if(s==='swim')swD.push(row);else if(s==='indoor')idD.push(row);else if(s==='absent')abD.push(row);
    });
  });
  const mk=(data,cols)=>{const ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=cols;return ws;};
  XLSX.utils.book_append_sheet(wb,mk(all,[{wch:18},{wch:10},{wch:10},{wch:10}]),'전체 아동');
  XLSX.utils.book_append_sheet(wb,mk(swD,[{wch:18},{wch:10},{wch:10}]),'수영');
  XLSX.utils.book_append_sheet(wb,mk(idD,[{wch:18},{wch:10},{wch:10}]),'원내보육');
  XLSX.utils.book_append_sheet(wb,mk(abD,[{wch:18},{wch:10},{wch:10}]),'결석');
  const td=allData[`teachers`],tt=td?td.teachers||{}:{};
  const tD=[['이름','담당','참여여부','휴가유형']];
  ALL_T.forEach(t=>{
    const s=tt[t.n];
    const st=!s?.s?'미입력':s.s==='attend'?'참여':s.s==='off'?'불참':'당일휴가';
    const lt=s?.lt==='am'?'오전반차':s?.lt==='pm'?'오후반차':s?.lt==='all'?'종일휴가':'';
    tD.push([t.n,t.r,st,lt]);
  });
  XLSX.utils.book_append_sheet(wb,mk(tD,[{wch:10},{wch:14},{wch:10},{wch:10}]),'교사 현황');
  XLSX.writeFile(wb,'수영참여현황.xlsx');
  toast('엑셀 파일이 다운로드됐어요');
};

$('pwInput').focus();
</script>
