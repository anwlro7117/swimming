<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수영장 배정표 생성</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{--primary:#0284c7;--primary-dark:#0369a1;--primary-light:#0ea5e9;--text:#0c4a6e;--muted:#64748b;--border:#bae6fd}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:linear-gradient(135deg,#e0f2fe 0%,#bae6fd 100%);min-height:100vh;padding:16px;color:var(--text)}
  .wrap{max-width:820px;margin:0 auto}
  .card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(2,132,199,.12);margin-bottom:14px}
  h1{font-size:22px;font-weight:800;color:var(--primary-dark);text-align:center;margin-bottom:6px}
  .sub{text-align:center;color:var(--primary);font-size:13px;margin-bottom:12px}
  .status-bar{padding:8px 12px;border-radius:10px;font-size:12px;text-align:center;font-weight:600}
  .connected{background:#dcfce7;color:#166534}.connecting{background:#fef3c7;color:#92400e}.error{background:#fee2e2;color:#991b1b}
  .ct{font-size:16px;font-weight:800;color:var(--primary-dark);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .ct small{font-size:12px;color:var(--muted);font-weight:600}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:14px}
  input[type=text]{flex:1;min-width:200px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;color:var(--text)}
  .btn{padding:9px 14px;border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;background:#e0f2fe;color:var(--primary-dark)}
  .btn.main{width:100%;padding:16px;font-size:17px;background:linear-gradient(135deg,var(--primary-light),var(--primary));color:#fff;box-shadow:0 6px 18px rgba(2,132,199,.3)}
  .btn:disabled{opacity:.5;cursor:default}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border:1px solid #e2e8f0;padding:7px 8px;vertical-align:top;text-align:left}
  th{background:#f0f9ff;font-weight:800;white-space:nowrap}
  td.n{text-align:center;font-weight:800;white-space:nowrap}
  .tm{text-align:center;font-weight:800;background:#f8fafc;white-space:nowrap}
  .b{display:inline-block;font-size:11px;padding:2px 7px;border-radius:9px;font-weight:700;margin:1px 2px 1px 0}
  .b-s{background:#fef3c7;color:#92400e}.b-n{background:#f1f5f9;color:#475569}.b-q{background:#fee2e2;color:#991b1b}
  .tline{font-size:13px;line-height:1.7;margin-bottom:4px}
  .warn{background:#fff7ed;border:1.5px solid #fdba74;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.7;color:#9a3412}
  .warn b{color:#7c2d12}
  .ok{background:#f0fdf4;border:1.5px solid #86efac;border-radius:12px;padding:12px 14px;font-size:13px;color:#166534}
  .gate{max-width:320px;margin:80px auto;text-align:center}
  .gate input{width:100%;margin:14px 0;text-align:center}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(150%);background:#0f172a;color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .3s;z-index:9;max-width:90%;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="card gate" id="gate">
  <h1>🔒 관리자</h1>
  <input type="password" id="pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')unlock()">
  <button class="btn main" onclick="unlock()">확인</button>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="card">
    <h1>📄 수영장 배정표 자동 생성</h1>
    <div class="sub">수영조사 응답이 바뀌면 이 화면이 바로 바뀝니다. 다운로드하면 최신 HWPX가 나옵니다.</div>
    <div id="statusBar" class="status-bar connecting">⏳ 연결 중...</div>
  </div>

  <div class="card">
    <div class="ct"><span>1️⃣ 양식</span><small id="tplInfo">-</small></div>
    <div class="row">
      <label class="btn" style="display:inline-block">📂 양식 교체 (HWPX)
        <input type="file" accept=".hwpx" id="tplFile" style="display:none">
      </label>
      <button class="btn" onclick="resetTemplate()">기본 양식으로</button>
    </div>
    <div style="font-size:12px;color:var(--muted);line-height:1.6">
      교사 배치·차량·샤워 등은 양식 내용 그대로 유지됩니다. 매달 새 배치표를 만들면 그 HWPX를 양식으로 교체하세요.<br>
      자동으로 바뀌는 곳: 제목 날짜, 반별 참여 아동·인원, 팀 인원, 원내보육 아동, 참여/불참/연차 교사.
    </div>
    <div class="row" style="margin-top:12px">
      <span style="font-weight:700">제목</span>
      <input type="text" id="titleInput" placeholder="2026년 10월 2일 수영장">
    </div>
  </div>

  <div class="card">
    <div class="ct"><span>2️⃣ 미리보기</span><small id="updatedAt"></small></div>
    <div id="warnBox" style="margin-bottom:12px"></div>
    <div class="scroll"><table id="childTbl"></table></div>
    <div id="stayLine" class="tline" style="margin-top:10px"></div>
    <div style="margin-top:14px" id="teacherBox"></div>
  </div>

  <div class="card">
    <button class="btn main" id="dlBtn" onclick="downloadHwpx()">⬇️ 최신 배정표 HWPX 다운로드</button>
  </div>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDojXJ_9pOnla8uG240APwo3Ik9gBddMw4",
  authDomain: "mujigae-swimming.firebaseapp.com",
  databaseURL: "https://mujigae-swimming-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mujigae-swimming",
  storageBucket: "mujigae-swimming.firebasestorage.app",
  messagingSenderId: "279953220805",
  appId: "1:279953220805:web:b24cbe70f8556416c0bcac"
};
const db = getDatabase(initializeApp(firebaseConfig));

const HP = 'http://www.hancom.co.kr/hwpml/2011/paragraph';
const LEAVE_LABEL = { full:'종일휴가', am:'오전반차', pm:'오후반차' };
const AFTERSCHOOL = ['다짐반','드림반','모둠반'];

// ---------- 상태 ----------
let swimming = {};           // swimming/{child|teacher}/{grp}/{name}
let roster = null;           // swimming_roster
let tpl = { name: TEMPLATE_DEFAULT_NAME, b64: TEMPLATE_DEFAULT_B64, custom:false };
let tplXml = null;           // section0.xml 문자열 (양식 원본)
let tplZip = null;
let lastPlan = null;

// ---------- 게이트 ----------
window.unlock = () => {
  if (document.getElementById('pw').value === '7117') {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    try { sessionStorage.setItem('swdoc_ok','1'); } catch(e){}
  } else toast('비밀번호가 틀렸습니다');
};
try { if (sessionStorage.getItem('swdoc_ok')==='1') { document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; } } catch(e){}

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.className='toast show'; setTimeout(()=>t.className='toast',2200); }

// ---------- Firebase ----------
const sb = document.getElementById('statusBar');
onValue(ref(db,'.info/connected'), s => { if (s.val()===true){ sb.className='status-bar connected'; sb.textContent='🟢 실시간 연결됨'; } });
setTimeout(()=>{ if (sb.classList.contains('connecting')){ sb.className='status-bar error'; sb.textContent='🔴 연결 실패'; } },10000);

onValue(ref(db,'swimming'), s => { swimming = s.val() || {}; refresh(); });
onValue(ref(db,'swimming_roster'), s => { roster = s.val(); refresh(); });
onValue(ref(db,'swimming_template'), async s => {
  const v = s.val();
  if (v && v.b64) tpl = { name: v.name || '업로드 양식', b64: v.b64, custom:true, ts:v.ts };
  else tpl = { name: TEMPLATE_DEFAULT_NAME, b64: TEMPLATE_DEFAULT_B64, custom:false };
  await loadTemplate();
});

// ---------- 양식 ----------
function b64ToBytes(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }
function bytesToB64(u){ let s=''; const CH=0x8000; for(let i=0;i<u.length;i+=CH) s+=String.fromCharCode.apply(null,u.subarray(i,i+CH)); return btoa(s); }

async function loadTemplate(){
  try {
    tplZip = await JSZip.loadAsync(b64ToBytes(tpl.b64));
    tplXml = await tplZip.file('Contents/section0.xml').async('string');
    const info = document.getElementById('tplInfo');
    info.textContent = (tpl.custom ? '📎 ' : '기본: ') + tpl.name + (tpl.ts ? ' · ' + new Date(tpl.ts).toLocaleDateString('ko-KR') : '');
    const m = allText(parse(tplXml)).match(/\d{4}년\s*\d{1,2}월\s*\d{1,2}일\s*수영장/);
    document.getElementById('titleInput').value = m ? m[0] : '';
    refresh();
  } catch(e){ toast('양식을 읽지 못했습니다: '+e.message); }
}

document.getElementById('tplFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const bytes = new Uint8Array(await f.arrayBuffer());
  try {
    const z = await JSZip.loadAsync(bytes);
    const x = await z.file('Contents/section0.xml').async('string');
    if (!findChildTable(parse(x))) throw new Error('"참여 아동" 표를 찾지 못했습니다');
  } catch(err){ toast('사용할 수 없는 양식: '+err.message); e.target.value=''; return; }
  const payload = { name: f.name.replace(/\.hwpx$/i,''), b64: bytesToB64(bytes), ts: Date.now() };
  try { await set(ref(db,'swimming_template'), payload); toast('✅ 양식 교체 완료 (모든 관리자에게 적용)'); }
  catch(err){ tpl = { ...payload, custom:true }; await loadTemplate(); toast('이 기기에서만 적용됨 (저장 권한 없음)'); }
  e.target.value='';
});
window.resetTemplate = async () => {
  if (!confirm('기본 양식(10/2)으로 되돌릴까요?')) return;
  try { await remove(ref(db,'swimming_template')); } catch(e){ tpl={name:TEMPLATE_DEFAULT_NAME,b64:TEMPLATE_DEFAULT_B64,custom:false}; await loadTemplate(); }
};

// ---------- XML 도우미 ----------
function parse(x){ return new DOMParser().parseFromString(x,'application/xml'); }
function kids(el, name){ return Array.from(el.childNodes).filter(n => n.nodeType===1 && n.localName===name); }
function kid(el, name){ return kids(el,name)[0]; }
function paras(tc){ const sl=kid(tc,'subList'); return sl ? kids(sl,'p') : []; }
function pText(p){ return Array.from(p.getElementsByTagNameNS(HP,'t')).map(t=>t.textContent).join(''); }
function cellLines(tc){ return paras(tc).map(pText); }
function allText(doc){ return Array.from(doc.getElementsByTagNameNS(HP,'t')).map(t=>t.textContent).join('\n'); }
function clearLineseg(p){ const la=kid(p,'linesegarray'); if(la) while(la.firstChild) la.removeChild(la.firstChild); }
function setT(t, text){ t.textContent = text; let p=t.parentNode; while(p && p.localName!=='p') p=p.parentNode; if(p) clearLineseg(p); }
function setCellLines(tc, lines){
  const sl = kid(tc,'subList'); const ps = kids(sl,'p'); const base = ps[0];
  const doc = tc.ownerDocument;
  lines.forEach(line => {
    const p = base.cloneNode(true);
    const runs = kids(p,'run');
    runs.slice(1).forEach(r => p.removeChild(r));
    const r = runs[0];
    while (r.firstChild) r.removeChild(r.firstChild);
    const t = doc.createElementNS(HP, r.prefix ? r.prefix+':t' : 't');
    t.textContent = line; r.appendChild(t);
    clearLineseg(p);
    sl.insertBefore(p, base);
  });
  ps.forEach(p => sl.removeChild(p));
}
function cellInfo(tc){
  const a = kid(tc,'cellAddr'), s = kid(tc,'cellSpan');
  return { tc, r:+a.getAttribute('rowAddr'), c:+a.getAttribute('colAddr'), rs:+s.getAttribute('rowSpan'), cs:+s.getAttribute('colSpan') };
}
function findChildTable(doc){
  for (const tbl of doc.getElementsByTagNameNS(HP,'tbl')) {
    const cells = Array.from(tbl.getElementsByTagNameNS(HP,'tc')).map(cellInfo);
    const head = cells.find(c => /^참여\s*아동/.test(cellLines(c.tc).join('')));
    if (head) return { tbl, cells, head };
  }
  return null;
}

// ---------- 데이터 정리 ----------
const ko = (a,b) => a.localeCompare(b,'ko');
function listOf(v){ return Array.isArray(v) ? v.filter(x=>x!=null) : Object.values(v||{}).filter(x=>x!=null); }
function childClasses(){
  const s = new Set(Object.keys(swimming.child||{}));
  if (roster && roster.child) ['mujigae','woori'].forEach(k => Object.keys(roster.child[k]||{}).forEach(g=>s.add(g)));
  return [...s];
}
function childRoster(cls){
  if (roster && roster.child) for (const k of ['mujigae','woori']) if (roster.child[k] && roster.child[k][cls]!==undefined) return listOf(roster.child[k][cls]);
  return null;
}
function teacherGroups(){
  const out = {};
  if (roster && roster.teacher) ['mujigae','woori','extra'].forEach(k => Object.entries(roster.teacher[k]||{}).forEach(([g,v])=>out[g]=listOf(v)));
  return out;
}
function matchClass(label, classes){
  return classes.find(c => c===label) || classes.find(c => c.startsWith(label)) || classes.find(c => label.startsWith(c)) || null;
}
function teacherCategory(grp){
  if (/치료사/.test(grp)) return '치료사';
  if (/연장|보조/.test(grp)) return '보조·연장';
  if (AFTERSCHOOL.includes(grp)) return '방과후';
  return '담임';
}

// ---------- 계획 계산 (양식 + 응답) ----------
function buildPlan(){
  if (!tplXml) return null;
  const doc = parse(tplXml);
  const ft = findChildTable(doc);
  if (!ft) return { error:'양식에서 "참여 아동" 표를 찾지 못했습니다.' };
  const namesCol = ft.head.c;
  const classes = childClasses();
  const childAns = swimming.child || {};

  // 반 행
  const rows = [];
  const usedClasses = new Set();
  const byRow = {};
  ft.cells.forEach(c => (byRow[c.r] ||= []).push(c));
  Object.keys(byRow).map(Number).sort((a,b)=>a-b).forEach(r => {
    if (r <= ft.head.r) return;
    const cells = byRow[r];
    const nameCell = cells.find(c => c.c===namesCol); if (!nameCell) return;
    const lblCell = cells.find(c => c.c>0 && c.c+c.cs===namesCol);
    if (!lblCell) return;
    const label = cellLines(lblCell.tc).join('').replace(/\s/g,'');
    const cls = matchClass(label, classes);
    const oldLines = cellLines(nameCell.tc);
    const arr = (oldLines.join(' ').match(/\d{1,2}:\d{2}\s*도착/)||[''])[0];
    const ans = cls ? (childAns[cls]||{}) : {};
    const yes = Object.keys(ans).filter(n=>ans[n].answer==='yes').sort(ko);
    const stay = Object.keys(ans).filter(n=>ans[n].answer==='stay').sort(ko);
    const no = Object.keys(ans).filter(n=>ans[n].answer==='no').sort(ko);
    const ros = cls ? childRoster(cls) : null;
    const pending = ros ? ros.filter(n => !ans[n]) : [];
    if (cls) usedClasses.add(cls);
    rows.push({ r, label, cls, nameCell, arr, yes, stay, no, pending });
  });

  // 팀
  const teams = ft.cells.filter(c => c.c===0 && c.r>ft.head.r).map(c => {
    const rs = rows.filter(x => x.r>=c.r && x.r<c.r+c.rs);
    return { cell:c, name: cellLines(c.tc).slice(0,-1).join('').replace(/\s/g,''), rows: rs, count: rs.reduce((s,x)=>s+x.yes.length,0) };
  });
  const total = rows.reduce((s,x)=>s+x.yes.length,0);

  // 원내보육 (원에 남음) — 전체 반
  const stayAll = [];
  Object.entries(childAns).forEach(([cls,a]) => Object.entries(a||{}).forEach(([n,v]) => { if (v.answer==='stay') stayAll.push(n); }));
  stayAll.sort(ko);

  // 문서에 없는 반의 참여자
  const offDoc = [];
  Object.entries(childAns).forEach(([cls,a]) => { if (usedClasses.has(cls)) return;
    const y = Object.keys(a||{}).filter(n=>a[n].answer==='yes'); if (y.length) offDoc.push(`${cls}: ${y.sort(ko).join(', ')}`); });

  // 교사
  const tAns = {}; const tGroupOf = {};
  Object.entries(swimming.teacher||{}).forEach(([g,a]) => Object.entries(a||{}).forEach(([n,v]) => { tAns[n]=v; tGroupOf[n]=g; }));
  const tg = teacherGroups();
  Object.entries(tg).forEach(([g,l]) => l.forEach(n => { if (!tGroupOf[n]) tGroupOf[n]=g; }));
  const out = n => tAns[n] && (tAns[n].answer==='no' || tAns[n].answer==='leave');

  const tLines = [];   // {t, cat, groups:[[names]]}
  Array.from(doc.getElementsByTagNameNS(HP,'t')).forEach(t => {
    const m = t.textContent.match(/^(\s*)(담임|방과후|치료사|보조·연장|보조|연장)\s*:\s*(.*)$/);
    if (m) tLines.push({ t, indent:m[1], cat:m[2], groups: m[3].split('/').map(g=>g.split(',').map(s=>s.trim()).filter(Boolean)) });
  });
  const inLines = new Set(); tLines.forEach(l => l.groups.flat().forEach(n=>inLines.add(n)));
  tLines.forEach(l => { l.groups = l.groups.map(g=>g.filter(n=>!out(n))).filter(g=>g.length); });
  const added = [];
  Object.entries(tAns).forEach(([n,v]) => {
    if (v.answer!=='yes' || inLines.has(n)) return;
    const cat = teacherCategory(tGroupOf[n]||'');
    let line = tLines.find(l => l.cat===cat) || tLines.find(l => cat==='보조·연장' && /보조|연장/.test(l.cat)) || tLines[0];
    if (!line) return;
    added.push(n);
    if (line.cat==='담임') {
      const mates = tg[tGroupOf[n]] || [];
      const g = line.groups.find(g => g.some(x => mates.includes(x)));
      if (g) g.push(n); else line.groups.push([n]);
    } else {
      if (!line.groups.length) line.groups.push([]);
      line.groups[line.groups.length-1].push(n);
    }
  });
  const tCount = tLines.reduce((s,l)=>s+l.groups.flat().length,0);
  const absent = Object.keys(tAns).filter(n=>tAns[n].answer==='no').sort(ko);
  const leaveBy = {};
  Object.keys(tAns).filter(n=>tAns[n].answer==='leave').sort(ko).forEach(n => { const k=LEAVE_LABEL[tAns[n].leaveType]||'연차'; (leaveBy[k] ||= []).push(n); });
  const leaveStr = Object.entries(leaveBy).map(([k,l]) => `${l.join(', ')} (${k})`).join(' / ');
  const tPending = Object.entries(tg).flatMap(([g,l]) => l.filter(n=>!tAns[n]));

  // 양식 곳곳에 배치된 불참·연차 교사
  const assigned = [];
  const outNames = Object.keys(tAns).filter(out);
  const tLineSet = new Set(tLines.map(l=>l.t));
  Array.from(doc.getElementsByTagNameNS(HP,'t')).forEach(t => {
    if (tLineSet.has(t) || /불참교사|연차사용/.test(t.textContent)) return;
    outNames.forEach(n => { if (t.textContent.includes(n)) assigned.push(`${n} → "${t.textContent.trim().slice(0,40)}"`); });
  });
  const cnt = {}; assigned.forEach(a => cnt[a]=(cnt[a]||0)+1);
  assigned.length = 0; Object.entries(cnt).forEach(([a,k]) => assigned.push(k>1 ? `${a} (${k}곳)` : a));

  return { doc, ft, rows, teams, total, stayAll, offDoc, tLines, tCount, absent, leaveStr, added, tPending, assigned, tAns };
}

// ---------- 미리보기 ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function refresh(){
  const plan = buildPlan(); lastPlan = plan;
  if (!plan) return;
  const warn = document.getElementById('warnBox');
  if (plan.error){ warn.innerHTML = `<div class="warn">${esc(plan.error)}</div>`; return; }

  let h = `<tr><th>팀</th><th>반</th><th>인원</th><th>참여 아동 (총 ${plan.total}명)</th><th>기타</th></tr>`;
  plan.teams.forEach(tm => tm.rows.forEach((x,i) => {
    h += '<tr>';
    if (i===0) h += `<td class="tm" rowspan="${tm.rows.length}">${esc(tm.name)}<br>${tm.count}</td>`;
    h += `<td class="n">${esc(x.label)}${x.cls?'':'<br><span class="b b-q">반 못찾음</span>'}</td><td class="n">${x.yes.length}</td>`;
    h += `<td>${esc(x.yes.join(', ')||'-')}${x.arr?`<br><small style="color:var(--muted)">${esc(x.arr)}</small>`:''}</td><td>`;
    x.stay.forEach(n=>h+=`<span class="b b-s">잔류 ${esc(n)}</span>`);
    x.no.forEach(n=>h+=`<span class="b b-n">결석 ${esc(n)}</span>`);
    x.pending.forEach(n=>h+=`<span class="b b-q">미응답 ${esc(n)}</span>`);
    h += '</td></tr>';
  }));
  document.getElementById('childTbl').innerHTML = h;
  document.getElementById('stayLine').innerHTML = `<b>원내보육</b> : ${esc(plan.stayAll.join(', ')||'없음')} (${plan.stayAll.length}명)`;

  let t = `<div class="ct" style="margin-bottom:6px"><span>👩‍🏫 교사</span></div>`;
  t += `<div class="tline"><b>■ 참여교사 (${plan.tCount}명)</b></div>`;
  plan.tLines.forEach(l => t += `<div class="tline">&nbsp;&nbsp;${esc(l.cat)} : ${esc(l.groups.map(g=>g.join(', ')).join(' / '))}</div>`);
  t += `<div class="tline"><b>■ 불참교사</b> : ${esc(plan.absent.join(', ')||'없음')}</div>`;
  t += `<div class="tline"><b>■ 연차사용 교사</b> : ${esc(plan.leaveStr||'없음')}</div>`;
  document.getElementById('teacherBox').innerHTML = t;

  const w = [];
  const pend = plan.rows.flatMap(x=>x.pending);
  if (pend.length) w.push(`<b>아동 미응답 ${pend.length}명</b> — 문서에서 제외됨: ${esc(pend.join(', '))}`);
  plan.rows.filter(x=>!x.cls).forEach(x => w.push(`<b>반 이름 불일치</b>: 양식의 "${esc(x.label)}"에 맞는 조사 반이 없음`));
  if (plan.offDoc.length) w.push(`<b>양식에 없는 반의 참여자</b> — 문서에 안 들어감: ${esc(plan.offDoc.join(' / '))}`);
  if (plan.assigned.length) w.push(`<b>불참·연차 교사가 배치표에 남아 있음</b> (직접 수정 필요):<br>${plan.assigned.map(esc).join('<br>')}`);
  if (plan.added.length) w.push(`<b>양식에 없던 참여교사 추가</b>: ${esc(plan.added.join(', '))} — 지원교사 배치는 직접 확인`);
  if (plan.tPending.length) w.push(`<b>교사 미응답</b>: ${esc(plan.tPending.join(', '))}`);
  warn.innerHTML = w.length ? `<div class="warn">⚠️ ${w.join('<br>⚠️ ')}</div>` : `<div class="ok">✅ 확인할 사항 없음</div>`;
  document.getElementById('updatedAt').textContent = '갱신 ' + new Date().toLocaleTimeString('ko-KR');
}

// ---------- HWPX 생성 ----------
function applyPlan(plan, title){
  const { doc } = plan;
  plan.rows.forEach(x => {
    if (!x.cls) return;
    const body = (x.yes.length ? x.yes.join(', ') : '없음') + ` (${x.yes.length})`;
    setCellLines(x.nameCell.tc, x.arr ? [body, x.arr] : [body]);
  });
  plan.teams.forEach(tm => {
    const ps = paras(tm.cell.tc); const last = ps[ps.length-1];
    const t = last && last.getElementsByTagNameNS(HP,'t')[0];
    if (t && /^\s*\d+\s*$/.test(t.textContent)) setT(t, String(tm.count));
  });
  const ts = Array.from(doc.getElementsByTagNameNS(HP,'t'));
  ts.forEach(t => {
    const s = t.textContent;
    if (/^참여\s*아동\s*\(\d+\)/.test(s)) setT(t, s.replace(/\(\d+\)/, `(${plan.total})`));
    else if (title && /\d{4}년\s*\d{1,2}월\s*\d{1,2}일\s*수영장/.test(s)) t.textContent = s.replace(/\d{4}년\s*\d{1,2}월\s*\d{1,2}일\s*수영장/, title);
    else if (/^\s*원내보육\s*:/.test(s)) {
      const tail = (s.match(/\s+교사\s*:.*$/)||[''])[0];
      const who = plan.stayAll.length ? `${plan.stayAll.join(', ')} (${plan.stayAll.length}명)` : '없음';
      setT(t, `원내보육 : ${who}${tail}`);
    }
    else if (/^\s*■\s*참여교사/.test(s)) setT(t, s.replace(/\(\d+명\)/, `(${plan.tCount}명)`));
    else if (/^\s*■\s*불참교사/.test(s)) setT(t, `■ 불참교사 : ${plan.absent.join(', ')||'없음'}`);
    else if (/^\s*■\s*연차사용/.test(s)) setT(t, `■ 연차사용 교사 : ${plan.leaveStr||'없음'}`);
  });
  plan.tLines.forEach(l => setT(l.t, `${l.indent}${l.cat} : ${l.groups.map(g=>g.join(', ')).join(' / ')}`));
  let xml = new XMLSerializer().serializeToString(doc);
  if (!xml.startsWith('<?xml')) xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>' + xml;
  return xml;
}

window.downloadHwpx = async () => {
  const plan = buildPlan();
  if (!plan || plan.error) { toast(plan ? plan.error : '양식 로딩 중'); return; }
  const title = document.getElementById('titleInput').value.trim();
  const xml = applyPlan(plan, title);
  const src = await JSZip.loadAsync(b64ToBytes(tpl.b64));
  const outZip = new JSZip();
  outZip.file('mimetype', 'application/hwp+zip', { compression:'STORE' });
  const names = Object.keys(src.files).filter(n => n!=='mimetype' && !src.files[n].dir);
  for (const n of names) {
    if (n === 'Contents/section0.xml') outZip.file(n, xml);
    else outZip.file(n, await src.file(n).async('uint8array'));
  }
  const blob = await outZip.generateAsync({ type:'blob', mimeType:'application/hwp+zip', compression:'DEFLATE' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (title || '수영장 배정표') + '.hwpx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast('✅ 다운로드 완료');
};
window.__test = { buildPlan, applyPlan, loadTemplate, setData:(s,r)=>{swimming=s;roster=r;refresh();} };
</script>
